<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="LibreChat - An open source chat application with support for multiple AI models"
    />
    <title>LibreChat</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      (function () {
        /* Applied before first paint so the app does not flash at the wrong scale.
         * A stored value outside the supported range is clamped rather than ignored,
         * so the rendered scale cannot disagree with the value the setting shows. */
        let uiScale = 1;
        try {
          const storedScale = JSON.parse(localStorage.getItem('uiScale'));
          if (typeof storedScale === 'number' && Number.isFinite(storedScale)) {
            uiScale = Math.min(1.5, Math.max(0.5, storedScale));
          }
        } catch (e) {
          /* Web Storage denied or unparsable: the default scale applies. */
        }
        /* The stylesheet's :root already declares 1, so the default leaves the
         * root's inline style untouched. */
        if (uiScale !== 1) {
          document.documentElement.style.setProperty('--ui-scale', String(uiScale));
        }

        let theme = null;
        try {
          theme = localStorage.getItem('color-theme');
        } catch (e) {
          /* Web Storage denied by browser policy: the shell falls back to the system theme. */
        }
        const loadingContainerStyle = document.createElement('style');
        let dark;
        let contrast;

        if (theme === 'high-contrast-dark' || theme === 'high-contrast-light') {
          dark = theme === 'high-contrast-dark';
          contrast = true;
        } else if (theme === 'dark' || theme === 'light') {
          dark = theme === 'dark';
          contrast = false;
        } else {
          /* `system`, and anything unset or unrecognised, which ThemeProvider also
           * resolves as `system`. The OS decides the scheme and the contrast, and
           * a contrast request moves the dark canvas to pure black, so keying off
           * the scheme alone would flash #0d0d0d behind the black palette.
           * The three contrast queries mirror ThemeProvider's `CONTRAST_QUERIES`:
           * a Windows Contrast Theme reports `forced-colors: active` with
           * `prefers-contrast: custom`, never `more`. */
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          contrast = [
            '(prefers-contrast: more)',
            '(prefers-contrast: custom)',
            '(forced-colors: active)',
          ].some(function (query) {
            return window.matchMedia(query).matches;
          });
        }
        let backgroundColor = dark ? (contrast ? '#000000' : '#0d0d0d') : '#ffffff';
        const root = document.documentElement;
        root.classList.add(dark ? 'dark' : 'light');

        /* The deployment theme (`interface.theme`) arrives with /api/config, so a
         * signed-in reload replays the copy DeploymentTheme cached under
         * `deployment-theme` (client/src/Providers/themeCache.ts) to paint it
         * before the bundle runs. High contrast outranks it, as in ThemeProvider,
         * which drops this copy (`data-theme-boot`) once it applies its own. */
        const base = document.querySelector('base');
        const basePath = base ? new URL(base.href).pathname : '/';
        const path =
          location.pathname.indexOf(basePath) === 0
            ? location.pathname.slice(basePath.length)
            : location.pathname.replace(/^\//, '');
        /* Same list as `isPublicRoute`: auth pages and shared links never render
         * under the viewer's signed-in config. */
        const publicRoute =
          /^(?:share|oauth|login|register|forgot-password|reset-password|verify)(?:\/|$)/i.test(
            path,
          );
        if (!contrast && !publicRoute) {
          try {
            const cached = JSON.parse(localStorage.getItem('deployment-theme') || 'null');
            const boot =
              cached && cached.v === 2 && cached.modes && cached.modes[dark ? 'dark' : 'light'];
            if (boot && Array.isArray(boot.properties)) {
              let surface;
              let canvas;
              /* Only the conversation paints the canvas, and the redirects that land on it; other routes keep the split surface. */
              const chatRoute =
                path === '' ||
                /^(?:c(?:\/|$)|prompts(?:\/new)?\/?$)/i.test(path) ||
                (/^d(?:\/|$)/i.test(path) && !/^d\/prompts\/(?!new\/?$)[^/]/i.test(path));
              boot.properties.forEach(function (entry) {
                if (typeof entry[0] === 'string' && entry[0].indexOf('--') === 0) {
                  root.style.setProperty(entry[0], String(entry[1]));
                  /* Only an `R G B` triple reaches the shell's stylesheet text; any
                   * whitespace between channels is accepted, as the theme validator does. */
                  const channels = String(entry[1]).trim().split(/\s+/);
                  if (
                    (entry[0] === '--surface-primary-alt' || entry[0] === '--surface-canvas') &&
                    channels.length === 3 &&
                    channels.every(function (channel) {
                      return /^\d{1,3}$/.test(channel);
                    })
                  ) {
                    /* The conversation paints `surface-canvas`; a cache from before that role
                     * existed carries only the split surface it followed. */
                    if (entry[0] === '--surface-canvas') {
                      canvas = channels.join(', ');
                    } else {
                      surface = channels.join(', ');
                    }
                  }
                }
              });
              ['data-theme', 'data-theme-disabled', 'data-theme-field-focus'].forEach(
                function (name) {
                  const value = boot.attributes && boot.attributes[name];
                  if (typeof value === 'string') {
                    root.setAttribute(name, value);
                  }
                },
              );
              root.setAttribute('data-theme-boot', '');
              if ((chatRoute && canvas) || surface) {
                backgroundColor = 'rgb(' + ((chatRoute && canvas) || surface) + ')';
              }
            }
          } catch (e) {
            /* Denied or corrupt storage paints the stock shell, as before. */
          }
        }

        loadingContainerStyle.innerHTML = `
          #loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: ${backgroundColor};
          }
        `;
        document.head.appendChild(loadingContainerStyle);
      })();
    </script>
    <script>
      (function () {
        var KEY = 'lc-asset-recovery-at';
        var RUM_QUEUE_KEY = 'lc-rum-queue';
        var MAX_RUM_QUEUE = 20;
        window.__lcRumRecoveryGuardInstalled = true;
        window.__lcRumQueue = Array.isArray(window.__lcRumQueue) ? window.__lcRumQueue : [];
        try {
          var persistedQueue = JSON.parse(sessionStorage.getItem(RUM_QUEUE_KEY) || '[]');
          if (Array.isArray(persistedQueue)) {
            window.__lcRumQueue = persistedQueue.concat(window.__lcRumQueue).slice(-MAX_RUM_QUEUE);
          }
        } catch (e) {
          /* Diagnostics should never affect application startup. */
        }
        window.__lcRumPush = function (type, attributes) {
          try {
            var safeAttributes = {};
            Object.keys(attributes || {}).forEach(function (key) {
              var value = attributes[key];
              if (
                typeof value !== 'string' &&
                typeof value !== 'number' &&
                typeof value !== 'boolean'
              ) {
                return;
              }
              safeAttributes[key] = value;
            });
            /* Stamp before persistence: a recovery reload may precede the RUM module. */
            safeAttributes.clientBuildId = 'unknown';
            var entryScripts = document.querySelectorAll('script[type="module"][src]');
            for (var i = 0; i < entryScripts.length; i++) {
              var filename = entryScripts[i]
                .getAttribute('src')
                .split(/[?#]/, 1)[0]
                .split('/')
                .pop();
              if (/^index[.-][\w-]+\.js$/.test(filename)) {
                safeAttributes.clientBuildId = filename;
                break;
              }
            }
            if (window.__lcRumQueue.length >= MAX_RUM_QUEUE) {
              window.__lcRumQueue.shift();
            }
            window.__lcRumQueue.push({
              type: type,
              at: Math.round(performance.now()),
              visibilityState: document.visibilityState,
              attributes: safeAttributes,
            });
            sessionStorage.setItem(RUM_QUEUE_KEY, JSON.stringify(window.__lcRumQueue));
          } catch (e) {
            /* Diagnostics should never affect application startup. */
          }
        };
        function shouldRecover() {
          try {
            var last = Number(sessionStorage.getItem(KEY)) || 0;
            if (Date.now() - last < 60000) {
              return false;
            }
            sessionStorage.setItem(KEY, String(Date.now()));
            return true;
          } catch (e) {
            return false;
          }
        }
        /* Every caller in this page shares one recovery: once a reload is underway, later
         * chunk failures (Vite preload, unhandled rejection, error boundary) join it instead
         * of tripping the loop guard and painting the error page before the reload lands. */
        window.__lcRecoverStaleAssets = function () {
          if (window.__lcStaleAssetRecoveryPending === true) {
            return true;
          }
          if (!shouldRecover()) {
            window.__lcRumPush('stale-asset-recovery-declined');
            return false;
          }
          window.__lcStaleAssetRecoveryPending = true;
          window.__lcRumPush('stale-asset-recovery-start');
          var reload = function () {
            window.__lcRumPush('stale-asset-recovery-reload');
            window.location.reload();
          };
          if (navigator.serviceWorker) {
            var scopeBase = new URL('./', document.baseURI || window.location.href).href;
            navigator.serviceWorker
              .getRegistrations()
              .then(function (registrations) {
                return Promise.all(
                  registrations
                    .filter(function (registration) {
                      return registration.scope.indexOf(scopeBase) === 0;
                    })
                    .map(function (registration) {
                      return registration.unregister();
                    }),
                );
              })
              .then(reload, reload);
          } else {
            reload();
          }
          return true;
        };
        if (navigator.serviceWorker) {
          navigator.serviceWorker.addEventListener('message', function (event) {
            if (!event.data || event.data.type !== 'LC_SW_PING') {
              return;
            }
            var source = event.source || navigator.serviceWorker.controller;
            if (source) {
              source.postMessage({ type: 'LC_SW_PONG' });
            }
          });
        }
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || !el.tagName) {
              return;
            }
            var failedScript = el.tagName === 'SCRIPT' && el.src;
            var failedPreload =
              el.tagName === 'LINK' && /preload/.test(el.rel || '') && /\.js$/.test(el.href || '');
            if (failedScript || failedPreload) {
              var isRumBootstrap = el.getAttribute('data-lc-rum-bootstrap') === 'true';
              window.__lcRumPush('asset-load-error', {
                tagName: el.tagName,
                assetUrl: el.src || el.href,
                optional: isRumBootstrap,
              });
              /* Caught optional imports must not reload the app. Required lazy imports
               * recover at their own boundary; preload links only report diagnostics. */
              if (isRumBootstrap || failedPreload) {
                return;
              }
              window.__lcRecoverStaleAssets();
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var message = event.reason && event.reason.message;
          if (
            typeof message === 'string' &&
            (message.indexOf('dynamically imported module') !== -1 ||
              message.indexOf('Importing a module script failed') !== -1)
          ) {
            window.__lcRumPush('dynamic-import-error');
            window.__lcRecoverStaleAssets();
          }
        });
      })();
    </script>
    <script
      data-lc-rum-bootstrap="true"
      type="module"
      src="/src/lib/rum/bootstrap-entry.js"
    ></script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
  </body>
</html>
