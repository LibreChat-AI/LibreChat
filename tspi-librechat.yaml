version: 1.3.15

cache: true

# TSPI Digital Twin — clinician chat for TSPI Brain.
# Day 1: WorkOS login, per-user token passthrough to the TSPI MCP, one locked clinical model spec.
# Day 2: clinician UI lock-down, treatment-plan Skill (skill/tspi-treatment-plan), terms of use.

interface:
  # UI-only flags below apply to everyone; admins get modelSelect/parameters/presets back through
  # an ADMIN role config override in the admin panel (admin.tspipro.com).
  #
  # Role PERMISSIONS (prompts, memories, agents, skills, mcpServers, multiConvo, peoplePicker) are
  # deliberately NOT set here: anything set here is re-applied to BOTH the USER and ADMIN roles on
  # every restart, which would also lock admins out. They are set per role instead, see
  # docs/tspi-day2-roles.md (USER = clinician view, ADMIN = everything).
  # {{user.name}} is the signed-in user's name (left out cleanly when the account has no name).
  customWelcome: 'Hi {{user.name}}, welcome to TSPI Digital Twin. Upload a lab report or describe symptoms to start a TSPI health analysis.'
  modelSelect: false
  parameters: false
  presets: false
  bookmarks: true
  marketplace:
    use: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  fileSearch: true
  fileCitations: true
  webSearch: true
  runCode: true
  temporaryChat: true
  feedback: true
  # Scheduled chats (sidebar). Experimental in LibreChat and off unless switched on here.
  # Per-role USE/CREATE is set in docs/tspi-day2-roles.mongosh.js.
  schedules: true
  defaultPinnedTools:
    - 'web_search'
    - 'execute_code'
    - 'mcp'
  privacyPolicy:
    externalUrl: 'https://chat.tspipro.com/legal/privacy.html'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://chat.tspipro.com/legal/terms.html'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'TSPI Digital Twin: terms of use'
    modalContent: |
      # Terms of use for TSPI Digital Twin

      By continuing you agree to the full Terms of Service and Privacy Policy linked below. In short:

      1. **Not medical advice.** TSPI Digital Twin produces AI-generated drafts. A draft is not a diagnosis or a prescription.
      2. **Patients:** your TSPI health report is an **unreviewed AI draft**. It has not been reviewed or approved by a TSPI doctor. Do not start, stop or change any medicine or supplement because of it. To have it reviewed, contact TSPI Digital Twin at https://tspi-main.vercel.app/contact.
      3. **Clinicians:** every treatment plan must be reviewed and approved by the treating physician before patient use. Clinical decisions remain your responsibility, and you confirm you have the patient's consent.
      4. **No identifiers.** Do not enter names, dates of birth, record numbers, phone numbers, emails or addresses.
      5. **Emergencies.** TSPI Digital Twin is not for emergencies. If you have severe symptoms, call your local emergency number (India 112, Thailand 1669) or go to the nearest hospital.
      6. **Records.** Your conversations, uploads, reports, approvals and edits are stored and logged under your account, as described in the Privacy Policy.

# Memories (sidebar). A small background model saves user preferences between chats.
memory:
  disabled: false
  personalize: true
  agent:
    provider: OpenRouter # staging; production: anthropic / claude-haiku-4-5-20251001
    model: google/gemma-4-26b-a4b-it
    instructions: |
      Save only the user's working preferences (language, report style, units, how they like
      answers formatted). Never save patient or case details: no symptoms, labs, diagnoses,
      medications, ages, case codes, names, dates of birth, record numbers or contact details.

webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none

mcpServers:
  tspi:
    title: TSPI Brain
    description: TSPI AI Brain clinical decision support (de-identified cases only)
    type: streamable-http
    url: https://mcp.tspipro.com/mcp
    headers:
      # A 5-minute TSPI token the chat signs for the signed-in user (auth/tspiMcpToken.ts),
      # minted fresh for every connection and tool call. Needs TSPI_MCP_JWT_PRIVATE_KEY_BASE64.
      Authorization: 'Bearer {{TSPI_MCP_TOKEN}}'
    # The MCP still advertises WorkOS OAuth for Claude.ai and other connectors. The chat must
    # never start that flow: a rejected chat token is an error, not a sign-in prompt.
    requiresOAuth: false
    # Off on purpose: the tspi-treatment-plan skill carries every server rule (de-identified case,
    # red flags first, draft-until-approved, patient banner, \ui markers) plus this app's own
    # policy (patient label kept in the chat only, generated case codes). Pulling both in gives a
    # small model two conflicting instructions about patient names.
    serverInstructions: false
    chatMenu: false # clinicians cannot switch it off
    startup: false # no app-level connection: every connection is per user, with their token
    # Confirming the last plan step composes the report with an LLM and Q&A answers can take up to
    # the engine's ASK_LLM_BUDGET_S (120 s): keep this above both, below the MCP's TSPI_REPORT_TIMEOUT.
    timeout: 300000

endpoints:
  # Caps tool-call steps per reply so a failing tool cannot loop for minutes (default is 25).
  agents:
    recursionLimit: 15
    maxRecursionLimit: 25
  # Production target (not used on staging yet): switch the spec preset back to
  # `endpoint: anthropic`, `model: claude-sonnet-5-5` and set ENDPOINTS=agents,anthropic.
  anthropic:
    models:
      - claude-sonnet-5-5
      - claude-haiku-4-5-20251001
    titleConvo: true
    titleModel: claude-haiku-4-5-20251001
  # Staging model: Gemma 4 26B A4B through OpenRouter (OpenAI-compatible API).
  # Key stays server-side in OPENROUTER_KEY.
  custom:
    - name: OpenRouter
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - google/gemma-4-26b-a4b-it
        fetch: false
      titleConvo: true
      titleModel: google/gemma-4-26b-a4b-it
      modelDisplayLabel: OpenRouter
      # OpenRouter models use different stop tokens; LibreChat's default stop list breaks some of them.
      dropParams: ['stop']
      addParams:
        # PDFs sent with "Upload to Provider" are parsed by OpenRouter before the model sees them.
        # cloudflare-ai is free and reads text PDFs; it is not documented to OCR scanned pages.
        # Pinned so OpenRouter never falls back to paid mistral-ocr (its default for Gemma, which has
        # no native PDF input). Scanned PDFs: use "Upload as Text"; the built-in parser sends
        # image-only pages to Gemma for OCR (PDF_VISION_OCR_* in .env, see .env.tspi.example).
        # To restore OCR of scanned PDFs (~$2 per 1,000 pages), set engine: mistral-ocr.
        plugins:
          - id: file-parser
            pdf:
              engine: cloudflare-ai
        # Health data: only route to OpenRouter providers that do not store or train on prompts.
        provider:
          data_collection: deny
          # Only route to hosts that accept every parameter we send (tools, tool_choice). Without
          # this, OpenRouter may pick a host with partial tool support and tool calls fail.
          require_parameters: true

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: tspi-clinical
      label: TSPI Digital Twin Assistant
      # TSPI logo in the header, the spec menu and message avatars (instead of the provider icon).
      # Must be an absolute URL: relative paths are not treated as images.
      iconURL: 'https://chat.tspipro.com/assets/logo.svg'
      showIconInHeader: true
      showIconInMenu: true
      # No Tools button and no tool chips in the chat box. Web search, Run Code and TSPI MCP
      # below are still always on: the server adds a spec's tools to every request.
      hideBadgeRow: true
      description: TSPI health analysis for patients and treatment-plan drafting for clinicians
      default: true
      mcpServers:
        - tspi
      webSearch: true
      executeCode: true
      skills:
        - tspi-treatment-plan
      # The first starter is also shown above the chat box in every conversation (opens a new chat).
      conversation_starters:
        - Start a new TSPI analysis
      preset:
        endpoint: OpenRouter # staging; production: anthropic / claude-sonnet-5-5
        model: google/gemma-4-26b-a4b-it
        promptPrefix: |
          You are TSPI Digital Twin, an assistant for the TSPI AI Brain. Follow the tspi-treatment-plan skill exactly.
          Current date and time: {{current_datetime}}. Signed-in user: {{current_user}}.
          - TSPI tool names in this app end in _mcp_tspi: whoami_mcp_tspi, engine_health_mcp_tspi,
            screen_red_flags_mcp_tspi, analyze_case_mcp_tspi, generate_treatment_plan_mcp_tspi,
            get_treatment_plan_mcp_tspi, approve_treatment_plan_mcp_tspi, update_treatment_plan_mcp_tspi,
            record_outcome_mcp_tspi, plan_start_mcp_tspi, plan_get_mcp_tspi, plan_confirm_step_mcp_tspi,
            plan_adjust_step_mcp_tspi, plan_go_back_mcp_tspi, ask_mcp_tspi. If any instructions say
            tspi_<name>, call <name>_mcp_tspi.
            Only call names that are in your tool list; never guess or rename one.
          - Connection check: at the start of every conversation call whoami_mcp_tspi. If it is missing
            or fails, show the matching message from the skill (not connected, session expired, or
            temporarily unavailable) and stop. Never show raw errors, tokens or JSON.
          - Role clinician or reviewer: clinician workflow. Role patient: patient workflow. Any other
            role: say there is no clinical access for this account and point to
            https://tspi-main.vercel.app/contact.
          - Never ask the user for a case id. Generate one per new analysis: TSPI-YYMMDD-HHMM-XX from the
            current date and time above. A clinician may give a patient name or nickname as a label;
            keep it in this chat only. Never put any name, date of birth, MRN, phone, email or address
            into a tool call, a PDF or a web search.
          - Do not ask users to type lab values or units. Ask them to upload the lab report, extract the
            results yourself, show them back as a table and ask for one confirmation (data + consent).
          - "Start a new TSPI analysis" means a new patient: forget every detail of any earlier case.
          - Approving, rejecting or editing a plan returns a pending change with a Confirm panel. Only
            the user's Confirm click applies it; never say it is done before the chat reports it, and
            never treat a message as the confirmation.
          - For a new case, always run screen_red_flags_mcp_tspi first. Show red flags before anything
            else; for a patient, urge them to seek urgent care now.
          - The TSPI engine is the only source of clinical conclusions. Present its output as-is and
            never invent or estimate scores, networks, modules, doses, evidence grades or outcomes.
          - Clinicians build a plan step by step (skill section F): plan_start_mcp_tspi, then one step per
            reply (case data check, red flags, axes, modules, dosing). Show each step's results and checks
            and wait: confirm, adjust or go back only when the clinician says so, and acknowledge only the
            checks they accepted. Confirming the dosing step generates the draft plan.
          - Patients get the one-shot report (generate_treatment_plan_mcp_tspi). After it, list every lab
            in the engine's analysis.unmapped_labs in plain words, with what would fix it (for
            clinicians the engine shows this in the case data check).
          - Medical or health questions (skill section L): call ask_mcp_tspi first and relay its answer
            with its citations, adding nothing. Only if TSPI Brain has no answer (or the tool is not
            available), do a web search for general medical literature, with no case details in the
            query, and label the reply "General medical information from the web, not from TSPI Brain."
          - Clinicians: a generated plan is an AI draft. Never call approve_treatment_plan_mcp_tspi unless
            the clinician has explicitly asked to approve that specific report_id in this conversation.
          - Patients see the analysis only: start every report with the banner "UNREVIEWED AI ANALYSIS.
            Not reviewed by a TSPI doctor. Not medical advice." The engine withholds the plan's modules
            and doses until a TSPI doctor approves it (plan_hidden): never name, guess or describe them,
            and offer a doctor review at https://tspi-main.vercel.app/contact. Use plain language. Never
            call approve_treatment_plan_mcp_tspi, update_treatment_plan_mcp_tspi,
            record_outcome_mcp_tspi or any plan_*_mcp_tspi tool for a patient.
          - Keep case details out of web searches; search only for general medical literature.
          - When a TSPI result includes a button panel, put its \ui{...} marker at the end of your
            reply. A button click arrives as a user message: carry it out (see the skill).
          - PDFs: the Download PDF button on the report panel downloads the PDF directly. Never write
            PDF code or ask users to print; if asked for a PDF, point to that button (skill section J).
