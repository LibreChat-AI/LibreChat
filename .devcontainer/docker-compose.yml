services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    networks: [default, extraction]
    depends_on:
      extraction:
        condition: service_healthy
    # restart: always
    links:
      - mongodb
      - meilisearch
    # ports:
    #   - 3080:3080               # Change it to 9000:3080 to use nginx
    extra_hosts: # if you are running APIs on docker you need access to, you will need to uncomment this line and next
    - "host.docker.internal:host-gateway"

    volumes:
      - extraction-credentials:/run/extraction:ro
      # This is where VS Code should expect to find your project's source code and the value of "workspaceFolder" in .devcontainer/devcontainer.json
      - ..:/workspaces:cached
      # Uncomment the next line to use Docker from inside the container. See https://aka.ms/vscode-remote/samples/docker-from-docker-compose for details.
      # - /var/run/docker.sock:/var/run/docker.sock 
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      # - OPENAI_REVERSE_PROXY=http://host.docker.internal:8070/v1
      - MEILI_HOST=http://meilisearch:7700

    # Runs app on the same network as the service container, allows "forwardPorts" in devcontainer.json function.
    # network_mode: service:another-service
    
    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

    # Use a non-root user for all processes - See https://aka.ms/vscode-remote/containers/non-root for details.
    user: vscode

    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"  

  mongodb:
    container_name: chat-mongodb
    expose:
      - 27017
    # ports:
    #   - 27018:27017
    image: mongo
    # restart: always
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.5
    # restart: always
    expose:
      - 7700
    # Uncomment this to access meilisearch from outside docker
    # ports: 
    #   - 7700:7700 # if exposing these ports, make sure your master key is not the default value
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=5c71cf56d672d009e36070b5bc5e47b743535ae55c818ae3b735bb6ebfb4ba63
    volumes:
      - ./meili_data_v1.5:/meili_data

  extraction-init:
    image: ${EXTRACTION_IMAGE:-librechat-extraction:local}
    pull_policy: never
    command: ['node', 'dist/provision.js']
    healthcheck:
      disable: true
    restart: 'no'
    init: true
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [extraction]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 16
    volumes:
      - extraction-credentials:/run/extraction

  extraction:
    image: ${EXTRACTION_IMAGE:-librechat-extraction:local}
    build:
      context: ${EXTRACTION_BUILD_CONTEXT:-https://github.com/LibreChat-AI/code-interpreter.git#c7bfe421243c66d4d5d9c6e3d08d276586ac47bf}
      dockerfile: packages/extraction/Dockerfile
      target: runtime
    pull_policy: build
    restart: unless-stopped
    init: true
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [extraction]
    depends_on:
      extraction-init:
        condition: service_completed_successfully
    mem_limit: 768m
    cpus: 2
    pids_limit: 32
    tmpfs:
      - /jobs:rw,noexec,nosuid,nodev,size=96m,nr_inodes=1024,uid=10001,gid=10001,mode=0700
    volumes:
      - extraction-credentials:/run/extraction:ro

volumes:
  extraction-credentials:

networks:
  extraction:
    internal: true
