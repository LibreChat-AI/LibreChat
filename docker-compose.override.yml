# Please consult our docs for more info: https://www.librechat.ai/docs/configuration/docker_override

# TO USE THIS FILE, FIRST UNCOMMENT THE LINE ('services:')

# THEN UNCOMMENT ONLY THE SECTION OR SECTIONS CONTAINING THE CHANGES YOU WANT TO APPLY
# SAVE THIS FILE AS 'docker-compose.override.yaml'
# AND USE THE 'docker compose build' & 'docker compose up -d' COMMANDS AS YOU WOULD NORMALLY DO

# WARNING: YOU CAN ONLY SPECIFY EVERY SERVICE NAME ONCE (api, mongodb, meilisearch, ...)
# IF YOU WANT TO OVERRIDE MULTIPLE SETTINGS IN ONE SERVICE YOU WILL HAVE TO EDIT ACCORDINGLY

# EXAMPLE: if you want to use the config file and the latest numbered release docker image the result will be:

services:
  api:
    image: librechat
    build:
      context: .
      target: node
    volumes:
    - type: bind
      source: ${PWD}/librechat.yaml
      target: /app/librechat.yaml
    # Legacy Mongo-backed dependency configuration retained for rollback reference:
    # depends_on:
    #   mongodb:
    #     condition: service_started
    depends_on: !override
      # rag_api:
      #   condition: service_started
      ministack:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      bedrock-kb-init:
        condition: service_completed_successfully
    environment:
      # Legacy runtime value inherited from docker-compose.yml:
      # MONGO_URI: mongodb://mongodb:27017/LibreChat
      MONGO_URI: ""
      # Legacy runtime value inherited from docker-compose.yml:
      # RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      # Blank so document text extraction uses the native parser instead of rag_api's /text.
      RAG_API_URL: ""
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: plastic-ai-files
      AWS_ENDPOINT_URL: http://ministack:${MINISTACK_PORT}
      AWS_FORCE_PATH_STYLE: "true"
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},meilisearch,chat-meilisearch,rag_api,vectordb,ministack,ollama,host.docker.internal
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},meilisearch,chat-meilisearch,rag_api,vectordb,ministack,ollama,host.docker.internal
    networks:
      - default
      - infra-network

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:${OLLAMA_PORT}
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_PATH}
        target: /root/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - infra-network

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:${OLLAMA_PORT}
    command: ["pull", "${OLLAMA_MODEL}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - infra-network

  ministack:
    image: ministackorg/ministack:1.5.16
    container_name: infra_ministack
    ports:
      - "${MINISTACK_PORT}:${MINISTACK_PORT}"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      LAMBDA_EXECUTOR: docker
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_infra-network
      GATEWAY_PORT: ${MINISTACK_PORT}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      MINISTACK_BEDROCK_PROXY_URL: http://ollama:${OLLAMA_PORT}
      MINISTACK_BEDROCK_PROXY_TIMEOUT_SECONDS: 300
      PERSIST_STATE: "1"
      STATE_DIR: /var/lib/ministack/state
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${MINISTACK_STATE_PATH}
        target: /var/lib/ministack/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MINISTACK_PORT}/_ministack/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - infra-network

  s3-init:
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url "http://ministack:${MINISTACK_PORT}" s3api list-buckets >/dev/null 2>&1; do sleep 2; done
        aws --endpoint-url "http://ministack:${MINISTACK_PORT}" s3api head-bucket --bucket plastic-ai-files >/dev/null 2>&1 ||
          aws --endpoint-url "http://ministack:${MINISTACK_PORT}" s3api create-bucket --bucket plastic-ai-files
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"
    networks:
      - infra-network

  # Idempotently provisions the shared Bedrock Knowledge Base + S3 data source.
  # ministack's CreateKnowledgeBase returns a server-generated id with no way to pin
  # it from compose, so — like the app's own resolveBedrockKbConfig() — this looks the
  # id up by name first (list-then-create), using the same idempotent pattern as the
  # the table.
  bedrock-kb-init:
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url "http://ministack:${MINISTACK_PORT}" bedrock-agent list-knowledge-bases >/dev/null 2>&1; do sleep 2; done
        kb_id=$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" bedrock-agent list-knowledge-bases \
          --query "knowledgeBaseSummaries[?name=='${BEDROCK_KB_NAME}'].knowledgeBaseId | [0]" --output text)
        if [ "$$kb_id" = "None" ] || [ -z "$$kb_id" ]; then
          kb_id=$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" bedrock-agent create-knowledge-base \
            --name "${BEDROCK_KB_NAME}" \
            --role-arn "arn:aws:iam::000000000000:role/ministack-kb-role" \
            --knowledge-base-configuration '{"type":"MANAGED","managedKnowledgeBaseConfiguration":{"embeddingModelType":"MANAGED"}}' \
            --query 'knowledgeBase.knowledgeBaseId' --output text)
        fi
        ds_id=$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" bedrock-agent list-data-sources \
          --knowledge-base-id "$$kb_id" \
          --query "dataSourceSummaries[?name=='${BEDROCK_KB_DATA_SOURCE_NAME}'].dataSourceId | [0]" --output text)
        if [ "$$ds_id" = "None" ] || [ -z "$$ds_id" ]; then
          aws --endpoint-url "http://ministack:${MINISTACK_PORT}" bedrock-agent create-data-source \
            --knowledge-base-id "$$kb_id" \
            --name "${BEDROCK_KB_DATA_SOURCE_NAME}" \
            --data-source-configuration "{\"type\":\"S3\",\"s3Configuration\":{\"bucketArn\":\"arn:aws:s3:::plastic-ai-files\",\"inclusionPrefixes\":[\"${BEDROCK_KB_DATA_SOURCE_PREFIX}\"]}}" \
            >/dev/null
        fi
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    depends_on:
      ministack:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - infra-network

  # cognito-init: idempotently provisions the ministack Cognito User Pool + App Client for
  # OIDC login. Resolves pool/client by name (list-then-create) like the siblings above.
  # ministack local-dev caveats (hardcoded confirmation codes, in-memory MFA, browser-vs-
  # container hosted-UI reachability) are documented in MIGRATION_ROADMAP.md Part B.2.
  cognito-init:
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp list-user-pools --max-results 60 >/dev/null 2>&1; do sleep 2; done
        pool_id=$$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp list-user-pools --max-results 60 \
          --query "UserPools[?Name=='${COGNITO_POOL_NAME}'].Id | [0]" --output text)
        if [ "$$pool_id" = "None" ] || [ -z "$$pool_id" ]; then
          pool_id=$$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp create-user-pool \
            --pool-name "${COGNITO_POOL_NAME}" --query 'UserPool.Id' --output text)
        fi
        client_id=$$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp list-user-pool-clients \
          --user-pool-id "$$pool_id" --max-results 60 \
          --query "UserPoolClients[?ClientName=='${COGNITO_CLIENT_NAME}'].ClientId | [0]" --output text)
        if [ "$$client_id" = "None" ] || [ -z "$$client_id" ]; then
          aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp create-user-pool-client \
            --user-pool-id "$$pool_id" \
            --client-name "${COGNITO_CLIENT_NAME}" \
            --no-generate-secret \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes openid profile email \
            --allowed-o-auth-flows-user-pool-client \
            --supported-identity-providers COGNITO \
            --callback-urls "${OPENID_CALLBACK_URL_ABSOLUTE:-http://localhost:3080/oauth/openid/callback}" \
            >/dev/null
        fi
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"
    networks:
      - infra-network

  mongodb:
    # Legacy service remains declared in docker-compose.yml but is inactive by default.
    profiles:
      - legacy-mongodb

  rag_api:
    # Legacy service remains declared in docker-compose.yml but is inactive by default,
    # superseded by the Bedrock Knowledge Base (bedrock-kb-init + ministack's bedrock-agent).
    profiles:
      - legacy-rag

  vectordb:
    # Legacy service remains declared in docker-compose.yml but is inactive by default.
    profiles:
      - legacy-rag


networks:
  infra-network:

