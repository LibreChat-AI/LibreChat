# Please consult our docs for more info: https://www.librechat.ai/docs/configuration/docker_override

# TO USE THIS FILE, FIRST UNCOMMENT THE LINE ('services:')

# THEN UNCOMMENT ONLY THE SECTION OR SECTIONS CONTAINING THE CHANGES YOU WANT TO APPLY
# SAVE THIS FILE AS 'docker-compose.override.yaml'
# AND USE THE 'docker compose build' & 'docker compose up -d' COMMANDS AS YOU WOULD NORMALLY DO

# WARNING: YOU CAN ONLY SPECIFY EVERY SERVICE NAME ONCE (api, mongodb, meilisearch, ...)
# IF YOU WANT TO OVERRIDE MULTIPLE SETTINGS IN ONE SERVICE YOU WILL HAVE TO EDIT ACCORDINGLY

# EXAMPLE: if you want to use the config file and the latest numbered release docker image the result will be:

services:
  api:
    image: librechat
    build:
      context: .
      target: node
    volumes:
    - type: bind
      source: ${PWD}/librechat.yaml
      target: /app/librechat.yaml
    - type: bind
      source: ./certs/documentdb
      target: /app/certs/documentdb
      read_only: true
    - type: bind
      source: ${AWS_PROFILE_DIR}
      target: /home/node/.aws
      read_only: true
    # Amazon DocumentDB is an external managed service, so the API must not wait
    # for the local MongoDB compatibility baseline.
    # depends_on:
    #   mongodb:
    #     condition: service_started
    depends_on: !override
      rag_api:
        condition: service_started
      ministack:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      # Override the upstream local MongoDB URI with an Amazon DocumentDB URI
      # from .env. The URI must include tls=true and retryWrites=false.
      # MONGO_URI: mongodb://mongodb:27017/LibreChat
      MONGO_URI: ${MONGO_URI}
      # Leave empty for local MongoDB; set to /app/certs/documentdb/global-bundle.pem for DocumentDB.
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_BUCKET_NAME: plastic-ai-files
      AWS_ENDPOINT_URL: http://ministack:${MINISTACK_PORT}
      # The global endpoint keeps local AWS services on ministack. Bedrock uses
      # its explicit librechat.yaml baseURL, while profile/SSO resolution must
      # reach real AWS instead of inheriting the global ministack endpoint.
      AWS_ENDPOINT_URL_SSO: https://portal.sso.${AWS_REGION}.amazonaws.com
      AWS_ENDPOINT_URL_SSO_OIDC: https://oidc.${AWS_REGION}.amazonaws.com
      AWS_ENDPOINT_URL_STS: https://sts.${AWS_REGION}.amazonaws.com
      AWS_FORCE_PATH_STYLE: "true"
      BEDROCK_AWS_DEFAULT_REGION: ${BEDROCK_AWS_DEFAULT_REGION}
      BEDROCK_AWS_PROFILE: ${BEDROCK_AWS_PROFILE}
      HOME: /home/node
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},meilisearch,chat-meilisearch,rag_api,vectordb,ministack,ollama,langfuse-web,otel-collector,host.docker.internal
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},meilisearch,chat-meilisearch,rag_api,vectordb,ministack,ollama,langfuse-web,otel-collector,host.docker.internal
    networks:
      - default
      - infra-network

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:${OLLAMA_PORT}
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_PATH}
        target: /root/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - infra-network

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:${OLLAMA_PORT}
    command: ["pull", "${OLLAMA_MODEL}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - infra-network

  ministack:
    image: ministackorg/ministack:1.5.16
    container_name: infra_ministack
    ports:
      - "${MINISTACK_PORT}:${MINISTACK_PORT}"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      LAMBDA_EXECUTOR: docker
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_infra-network
      GATEWAY_PORT: ${MINISTACK_PORT}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      MINISTACK_BEDROCK_PROXY_URL: http://ollama:${OLLAMA_PORT}
      MINISTACK_BEDROCK_PROXY_TIMEOUT_SECONDS: 120
      PERSIST_STATE: "1"
      STATE_DIR: /var/lib/ministack/state
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${MINISTACK_STATE_PATH}
        target: /var/lib/ministack/state
    healthcheck:
      # test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:${MINISTACK_PORT}/_ministack/health"]
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MINISTACK_PORT}/_ministack/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - infra-network

  s3-init:
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url "http://ministack:${MINISTACK_PORT}" s3api list-buckets >/dev/null 2>&1; do sleep 2; done
        aws --endpoint-url "http://ministack:${MINISTACK_PORT}" s3api head-bucket --bucket plastic-ai-files >/dev/null 2>&1 ||
          aws --endpoint-url "http://ministack:${MINISTACK_PORT}" s3api create-bucket --bucket plastic-ai-files
        aws --endpoint-url "http://ministack:${MINISTACK_PORT}" s3api head-bucket --bucket plastic-ai-langfuse >/dev/null 2>&1 ||
          aws --endpoint-url "http://ministack:${MINISTACK_PORT}" s3api create-bucket --bucket plastic-ai-langfuse
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"
    networks:
      - infra-network

  # cognito-init: idempotently provisions the ministack Cognito User Pool + App Client for
  # OIDC login. Resolves pool/client by name (list-then-create) like the siblings above.
  # ministack local-dev caveats (hardcoded confirmation codes, in-memory MFA, browser-vs-
  # container hosted-UI reachability) are documented in MIGRATION_ROADMAP.md Part B.2.
  cognito-init:
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp list-user-pools --max-results 60 >/dev/null 2>&1; do sleep 2; done
        pool_id=$$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp list-user-pools --max-results 60 \
          --query "UserPools[?Name=='${COGNITO_POOL_NAME}'].Id | [0]" --output text)
        if [ "$$pool_id" = "None" ] || [ -z "$$pool_id" ]; then
          pool_id=$$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp create-user-pool \
            --pool-name "${COGNITO_POOL_NAME}" --query 'UserPool.Id' --output text)
        fi
        client_id=$$(aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp list-user-pool-clients \
          --user-pool-id "$$pool_id" --max-results 60 \
          --query "UserPoolClients[?ClientName=='${COGNITO_CLIENT_NAME}'].ClientId | [0]" --output text)
        if [ "$$client_id" = "None" ] || [ -z "$$client_id" ]; then
          aws --endpoint-url "http://ministack:${MINISTACK_PORT}" cognito-idp create-user-pool-client \
            --user-pool-id "$$pool_id" \
            --client-name "${COGNITO_CLIENT_NAME}" \
            --no-generate-secret \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes openid profile email \
            --allowed-o-auth-flows-user-pool-client \
            --supported-identity-providers COGNITO \
            --callback-urls "${OPENID_CALLBACK_URL_ABSOLUTE:-http://localhost:3080/oauth/openid/callback}" \
            >/dev/null
        fi
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION}
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"
    networks:
      - infra-network

  mongodb:
    # MongoDB is only a local compatibility baseline. It is not an Amazon
    # DocumentDB emulator and cannot validate engine-specific behavior.
    command: mongod --noauth --replSet rs0 --bind_ip_all
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (error) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
          | grep 1
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - mongodb-compat
      - legacy-mongodb

  # ---------------------------------------------------------------------------
  # Observability (profile `observability`): Langfuse for GenAI traces and
  # HyperDX for browser activity, on one shared ClickHouse. The services mirror
  # terraform/{clickhouse,langfuse,hyperdx}.tf so the AWS wiring can be
  # exercised locally. The api does not depend on them: exports fail open.
  #
  #   docker compose --profile observability up -d
  #   Langfuse http://localhost:3100 (LANGFUSE_PORT)   HyperDX http://localhost:8080 (HYPERDX_PORT)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      HYPERDX_CLICKHOUSE_PASSWORD: ${HYPERDX_CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - type: bind
        source: ./otel/clickhouse/hyperdx.xml
        target: /etc/clickhouse-server/users.d/hyperdx.xml
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - observability
    networks:
      - infra-network

  langfuse-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - observability
    networks:
      - infra-network

  langfuse-redis:
    image: redis:7
    # Langfuse queues must never be evicted.
    command: ["--requirepass", "${LANGFUSE_REDIS_AUTH}", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" --no-auth-warning ping | grep PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
    profiles:
      - observability
    networks:
      - infra-network

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    environment: &langfuse-environment
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3100}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
      # Blob storage is the fork's S3 emulator; on AWS it is a real bucket.
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: plastic-ai-langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${AWS_REGION}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://ministack:${MINISTACK_PORT}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: plastic-ai-langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${AWS_REGION}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://ministack:${MINISTACK_PORT}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    profiles:
      - observability
    networks:
      - infra-network

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    ports:
      - "${LANGFUSE_PORT:-3100}:3000"
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: "true"
      # Headless bootstrap: one organisation, one project, one admin, and the API
      # key pair the app exports traces with (LANGFUSE_PUBLIC_KEY/SECRET_KEY).
      LANGFUSE_INIT_ORG_ID: plastic-ai
      LANGFUSE_INIT_ORG_NAME: plastic-ai
      LANGFUSE_INIT_PROJECT_ID: plastic-ai
      LANGFUSE_INIT_PROJECT_NAME: plastic-ai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    depends_on: *langfuse-depends-on
    profiles:
      - observability
    networks:
      - infra-network

  # HyperDX keeps accounts, dashboards and saved searches here; events go to ClickHouse.
  hyperdx-mongo:
    image: mongo:5.0.32-focal
    volumes:
      - hyperdx-mongo-data:/data/db
    profiles:
      - observability
    networks:
      - infra-network

  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx:2
    ports:
      - "${HYPERDX_PORT:-8080}:8080"
    # DEFAULT_SOURCES: the tables HyperDX reads, shared with terraform/hyperdx.tf.
    env_file:
      - ./otel/hyperdx/sources.env
    environment:
      FRONTEND_URL: http://localhost:${HYPERDX_PORT:-8080}
      MONGO_URI: mongodb://hyperdx-mongo:27017/hyperdx
      USAGE_STATS_ENABLED: "false"
      # Applied when the first account registers; registration closes after it.
      DEFAULT_CONNECTIONS: '[{"name":"ClickHouse","host":"http://clickhouse:8123","username":"hyperdx","password":"${HYPERDX_CLICKHOUSE_PASSWORD}"}]'
    depends_on:
      clickhouse:
        condition: service_healthy
      hyperdx-mongo:
        condition: service_started
    profiles:
      - observability
    networks:
      - infra-network

  # One-shot: adds the usage timeline source (the analytics.timeline view), its
  # saved search and the dashboards in otel/hyperdx/provision to every HyperDX
  # team. With no account registered yet it changes nothing, so after
  # registering run `docker compose run --rm hyperdx-provision`. Mirrors the
  # hyperdx-provision task in terraform/hyperdx.tf.
  hyperdx-provision:
    image: docker.hyperdx.io/hyperdx/hyperdx:2
    entrypoint: ["node", "/provision/provision.js"]
    working_dir: /app/packages/api
    environment:
      MONGO_URI: mongodb://hyperdx-mongo:27017/hyperdx
      HYPERDX_PROVISION_DIR: /provision
    volumes:
      - type: bind
        source: ./otel/hyperdx/provision
        target: /provision
        read_only: true
    depends_on:
      hyperdx:
        condition: service_started
      clickhouse-analytics-init:
        condition: service_completed_successfully
    restart: "no"
    profiles:
      - observability
    networks:
      - infra-network

  # Receives the browser telemetry the api forwards from /api/rum. It runs
  # standalone (no OpAMP), so the shared token is what guards its OTLP port.
  otel-collector:
    image: docker.clickhouse.com/clickhouse/clickstack-otel-collector:2
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
      CLICKHOUSE_USER: hyperdx
      CLICKHOUSE_PASSWORD: ${HYPERDX_CLICKHOUSE_PASSWORD}
      HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE: hyperdx
      OTLP_AUTH_TOKEN: ${RUM_PROXY_AUTHORIZATION}
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - observability
    networks:
      - infra-network

  # One-shot: creates the content-free `analytics` views
  # (otel/clickhouse/analytics.sql) that HyperDX's usage timeline reads, once
  # Langfuse and the collector have created their tables. Mirrors
  # terraform/clickhouse.tf.
  clickhouse-analytics-init:
    image: clickhouse/clickhouse-server:25.12
    entrypoint: ["/bin/sh", "/analytics-init.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ANALYTICS_SQL_FILE: /analytics.sql
    volumes:
      - type: bind
        source: ./otel/clickhouse/analytics-init.sh
        target: /analytics-init.sh
        read_only: true
      - type: bind
        source: ./otel/clickhouse/analytics.sql
        target: /analytics.sql
        read_only: true
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"
    profiles:
      - observability
    networks:
      - infra-network

networks:
  infra-network:

volumes:
  clickhouse-data:
  langfuse-postgres-data:
  hyperdx-mongo-data:

