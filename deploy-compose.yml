services:
  api:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.multi
    #   target: api-build
    image: ghcr.io/nexus-echo/tspichat-api:latest
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3080/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    container_name: LibreChat-API
    ports:
      - 3080:3080
    depends_on:
      - mongodb
      - rag_api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:-http://admin.localhost}
      - CONFIG_PATH=https://raw.githubusercontent.com/nexus-echo/TspiChat/main/tspi-librechat.yaml
      - LIBRECHAT_CODE_BASEURL=http://code-api:3112/v1
      - CODEAPI_AUTH_PROVIDER=librechat-jwt
      - CODEAPI_JWT_ALGORITHM=EdDSA
      - CODEAPI_JWT_KID=${CODEAPI_JWT_KID}
      - CODEAPI_JWT_PRIVATE_KEY_BASE64=${CODEAPI_JWT_PRIVATE_KEY_BASE64}
      - CODEAPI_JWT_ISSUER=librechat
      - CODEAPI_JWT_AUDIENCE=codeapi
      - CODEAPI_JWT_SINGLE_TENANT_ID=legacy
    volumes:
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./skill:/app/skill
      - librechat-data:/app/data

  admin-panel:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    labels:
      - traefik.enable=true
      - traefik.docker.network=cxdoqdslq6dwavqelmuujog2_default
      - traefik.http.middlewares.admin-redirect.redirectscheme.scheme=https
      - traefik.http.routers.admin-http.entrypoints=http
      - traefik.http.routers.admin-http.rule=Host(`admin.tspipro.com`)
      - traefik.http.routers.admin-http.middlewares=admin-redirect
      - traefik.http.routers.admin-https.entrypoints=https
      - traefik.http.routers.admin-https.rule=Host(`admin.tspipro.com`)
      - traefik.http.routers.admin-https.tls=true
      - traefik.http.routers.admin-https.tls.certresolver=letsencrypt
      - traefik.http.services.admin.loadbalancer.server.port=3000
    depends_on:
      - api
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:3080
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}

  client:
    image: nginx:1.27.0-alpine
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=cxdoqdslq6dwavqelmuujog2_default
      - traefik.http.middlewares.client-redirect.redirectscheme.scheme=https
      - traefik.http.routers.client-http.entrypoints=http
      - traefik.http.routers.client-http.rule=Host(`chat.tspipro.com`)
      - traefik.http.routers.client-http.middlewares=client-redirect
      - traefik.http.routers.client-https.entrypoints=https
      - traefik.http.routers.client-https.rule=Host(`chat.tspipro.com`)
      - traefik.http.routers.client-https.tls=true
      - traefik.http.routers.client-https.tls.certresolver=letsencrypt
      - traefik.http.services.client.loadbalancer.server.port=80
    depends_on:
      - api
      - admin-panel
    restart: always
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf

  mongodb:
    container_name: chat-mongodb
    # ports:  # Uncomment this to access mongodb from outside docker, not safe in deployment
    #   - 27018:27017
    image: mongo:8.0.20
    restart: always
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    # ports: # Uncomment this to access meilisearch from outside docker
    #   - 7700:7700 # if exposing these ports, make sure your master key is not the default value
    env_file:
      - .env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data_v1.35.1:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=5", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "myuser", "-d", "mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - pgdata2:/var/lib/postgresql/data

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    depends_on:
      vectordb:
        condition: service_healthy
    env_file:
      - .env


  # ===========================================================================
  # LibreChat Code Interpreter / Code API
  # ===========================================================================
  code-api:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile
      target: api
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3112/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    environment:
      - LOCAL_MODE=false
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - CODEAPI_AUTH_PROVIDER=librechat-jwt
      - CODEAPI_JWT_ISSUER=librechat
      - CODEAPI_JWT_AUDIENCE=codeapi
      - CODEAPI_JWT_ALLOWED_ALGS=EdDSA
      - CODEAPI_JWT_KID=${CODEAPI_JWT_KID}
      - CODEAPI_JWT_JWKS_JSON=${CODEAPI_JWT_JWKS_JSON}
      - CODEAPI_JWT_SINGLE_TENANT_ID=legacy
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN}
      - CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY=${CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY}
      - EXECUTION_MANIFEST_TTL_SECONDS=300
      - CODEAPI_HTTP_JSON_LIMIT=50mb
      - SERVICE_PORT=3112
      - SANDBOX_ENDPOINT=http://sandbox-runner:2000/api/v2
      - EGRESS_GATEWAY_URL=http://egress_gateway:3190
      - FILE_SERVER_URL=http://code-file-server:3000
      - TOOL_CALL_SERVER_URL=http://tool-call-server:3033
      - REDIS_HOST=code-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${CODEAPI_REDIS_PASSWORD}
    depends_on:
      code-redis:
        condition: service_healthy
      tool-call-server:
        condition: service_started
      sandbox-runner:
        condition: service_healthy
    networks:
      - default
      - code-private

  code-worker:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile
      target: worker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3113/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    environment:
      - LOCAL_MODE=false
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - CODEAPI_AUTH_PROVIDER=librechat-jwt
      - CODEAPI_JWT_SINGLE_TENANT_ID=legacy
      - CODEAPI_TENANT_ISOLATION_STRICT=true
      - CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY=${CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY}
      - EXECUTION_MANIFEST_TTL_SECONDS=300
      - SANDBOX_ENDPOINT=http://sandbox-runner:2000/api/v2
      - EGRESS_GATEWAY_URL=http://egress_gateway:3190
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN}
      - REDIS_HOST=code-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${CODEAPI_REDIS_PASSWORD}
      - PYTHON_CONCURRENCY=1
      - OTHER_CONCURRENCY=8
      - WORKER_HEALTH_PORT=3113
    depends_on:
      code-redis:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    networks:
      - code-private

  code-package-init:
    build:
      context: ./code-interpreter
      dockerfile: docker/Dockerfile.package-init
    restart: "no"
    environment:
      - PYTHON_VERSION=3.14.4
      - NODE_VERSION=24.15.0
      - BUN_VERSION=1.3.14
      - BASH_PACKAGE_VERSION=5.2.0
      - FORCE_REBUILD=false
    volumes:
      - codeapi-packages:/pkgs
    networks:
      - code-private

  sandbox-runner:
    build:
      context: ./code-interpreter
      dockerfile: api/Dockerfile
      target: sandbox-runner-false
    restart: always
    privileged: false
    cgroup: host
    environment:
      - KVM_ENABLED=false
      - SANDBOX_USE_CGROUPV2=true
      - SANDBOX_REMOVE_UMOUNT_AFTER_STARTUP=true
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - EGRESS_GATEWAY_URL=http://egress_gateway:3190
      - SANDBOX_EXECUTE_BODY_LIMIT=50mb
      - SANDBOX_PACKAGES_DIRECTORY=/pkgs
      - SANDBOX_LOG_LEVEL=DEBUG
      - SANDBOX_OUTPUT_MAX_SIZE=65536
      - SANDBOX_MAX_CONCURRENT_JOBS=8
      - SANDBOX_PER_JOB_UIDS=true
      - SANDBOX_JOB_UID_BASE=200000
      - SANDBOX_JOB_GID_BASE=200000
      - SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS=3600
      - SANDBOX_RUN_TIMEOUT=300000
      - SANDBOX_RUN_CPU_TIME=300000
      - SANDBOX_COMPILE_TIMEOUT=30000
      - SANDBOX_ALLOWED_LOCAL_NETWORK_PORT=3190
      - SANDBOX_FORWARD_TARGET=egress_gateway:3190
      - SANDBOX_REQUIRE_EGRESS_MANIFEST=true
      - SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY=${SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY}
      - ADMIN_PANEL_SESSION_SECRET=
      - CODEAPI_EGRESS_GRANT_SECRET=
      - CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY=
      - CODEAPI_INTERNAL_SERVICE_TOKEN=
      - CODEAPI_JWT_JWKS_JSON=
      - CODEAPI_JWT_KID=
      - CODEAPI_JWT_PRIVATE_KEY_BASE64=
      - CODEAPI_MINIO_ACCESS_KEY=
      - CODEAPI_MINIO_SECRET_KEY=
      - CODEAPI_REDIS_PASSWORD=
      - JWT_REFRESH_SECRET=
      - JWT_SECRET=
      - POSTGRES_PASSWORD=
      - SESSION_SECRET=
      - SANDBOX_RUNNER_CLOCK_SKEW_LIVENESS_LIMIT_SECONDS=10
      - SANDBOX_RUNNER_HEALTHCHECK_TIMEOUT_SECONDS=2
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rshared
      - codeapi-packages:/host-packages:ro
    security_opt:
      - seccomp=/opt/tspichat/seccomp/nsjail.json
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - SETUID
      - SETGID
      - NET_ADMIN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - CHOWN
      - FOWNER
      - FSETID
      - KILL
      - SETFCAP
      - MKNOD
    networks:
      - code-private
    healthcheck:
      test: ["CMD-SHELL", "exec /bin/sh /sandbox_healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  egress_gateway:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile.egress-gateway
      target: production
    restart: always
    environment:
      - SERVICE_NAME=egress-gateway
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - EGRESS_GATEWAY_PORT=3190
      - EGRESS_GATEWAY_FILE_SERVER_URL=http://code-file-server:3000
      - EGRESS_GATEWAY_TOOL_CALL_SERVER_URL=http://tool-call-server:3033
      - EGRESS_GATEWAY_MAX_TOOL_CALL_BYTES=1048576
      - CODEAPI_EGRESS_GRANT_SECRET=${CODEAPI_EGRESS_GRANT_SECRET}
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN}
      - REDIS_HOST=code-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${CODEAPI_REDIS_PASSWORD}
    depends_on:
      code-file-server:
        condition: service_started
      tool-call-server:
        condition: service_started
      code-redis:
        condition: service_healthy
    networks:
      - code-private

  tool-call-server:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile.tool-call-server
      target: production
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3033/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    environment:
      - TOOL_CALL_SERVER_PORT=3033
      - TOOL_CALL_REQUEST_TIMEOUT=300000
      - TOOL_CALL_SESSION_EXPIRY=600
      - REDIS_HOST=code-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${CODEAPI_REDIS_PASSWORD}
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN}
    depends_on:
      code-redis:
        condition: service_healthy
    networks:
      - code-private

  code-file-server:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile
      target: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    environment:
      - MINIO_BUCKET=librechat-codeapi
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${CODEAPI_MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${CODEAPI_MINIO_SECRET_KEY}
      - FILE_SERVER_PORT=3000
      - REDIS_HOST=code-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${CODEAPI_REDIS_PASSWORD}
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN}
    depends_on:
      code-redis:
        condition: service_healthy
    networks:
      - code-private
      - existing-minio

  code-redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${CODEAPI_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CODEAPI_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - code-private

volumes:
  pgdata2:
  librechat-data:
  codeapi-packages:

networks:
  code-private:
    internal: true
  existing-minio:
    external: true
    name: 3zbotqhamx2wjptsfgtq4jf5
