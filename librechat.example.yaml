  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  # Scheduled chats are experimental and disabled unless explicitly enabled.
  # A deployment with Redis-backed resumable streams can run this on every replica.
  # A single-process deployment without Redis must also set
  # `SCHEDULES_SINGLE_PROCESS=true`; unsafe multi-replica writes fail closed.
  # Scheduled agents that can pause require both `USE_REDIS_STREAMS=true` for
  # shared action state and a durable shared checkpointer for graph continuation.
  # MongoDB is currently the built-in durable checkpointer (and the default).
  # schedules:
  #   use: true
  #   create: true
  #   maxPerUser: 10
  #   minIntervalMinutes: 60
  #   autoDisableAfterFailures: 5
  #   # Maximum occurrences concurrently passing readiness admission per replica (1-100).
  #   admissionConcurrency: 20
  #   fireConcurrency: 5
  #   # Maximum MCP readiness connections opened at once by one schedule admission (1-10).
  #   mcpPreflightConcurrency: 3
  #   # Maximum wall-clock time for one MCP readiness admission (1000-600000 ms).
  #   mcpPreflightTimeoutMs: 300000
  #   # Require every schedule to be filed under a chat project. Enforced on
  #   # create/update AND at each fire, so turning it on stops (auto-disables)
  #   # schedules that predate it rather than letting their runs land loose.
  #   requireProject: false
  #   # Pin every scheduled run to ONE chat project, ignoring the user's choice.
  #   # Implies `requireProject`. Chat projects are user-owned, so a value set here
  #   # only makes sense as a per-user or per-role config override.
  #   # projectId: '000000000000000000000000'
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true
  # Show the thumbs up/thumbs down feedback buttons on responses (default: true)
  feedback: true
  # Unseen-reply alerts: what this deployment lets a reader turn on. Each field gates a
  # capability; the preference itself stays per device, because notification permission and
  # audio output belong to the machine the reader is sitting at. Sidebar unread dots and
  # Mark as unread are not gated here, they are part of the conversation list.
  # replyNotifications:
  #   tabBadge: true # Allow the unseen count in the tab title and favicon (default: true)
  #   desktop: true # Allow readers to turn on desktop notifications for replies (default: true)
  #   sound: true # Allow readers to turn on the reply chime (default: true)
  #   # How many conversations one background poll looks at (1-100, default: 100). The list's
  #   # own maximum page is the ceiling, so covering a deployment whose replies outpace one
  #   # page is not a matter of raising this.
  #   pollLimit: 100
  #   # Milliseconds between list checks while a tab is away (10000-600000, default: 30000).
  #   pollIntervalMs: 30000
  #   # Milliseconds between list refreshes while a tab is focused (60000-300000, default: 300000).
  #   # It renews the snapshot the unread count reads, so it cannot be slower than five minutes.
  #   focusedRefreshMs: 300000
  # Conversation trace viewer: a waterfall of the model calls and tool spans behind
  # each response, read from the deployment's Langfuse project. The control only
  # appears on the requesting user's own conversations with a sampled trace, and
  # needs a Langfuse release that serves the v2 Observations API.
  # traceViewer:
  #   enabled: false
  #   # Traces are matched to users by the internal user id, so no trace is shown while
  #   # langfuse.trace.userIdField exports another user field.
  #   # Return observation input, output and metadata in the record inspector. Input
  #   # carries system prompts, agent instructions and tool definitions, which a
  #   # user chatting with a shared agent cannot otherwise see.
  #   showInputOutput: false
  #   # Name the tools of each tool round from the round's own record. This adds
  #   # requests to Langfuse per listed page, and Langfuse returns each round's full
  #   # input and output to serve them, though only the tool names are kept and sent
  #   # on; arguments and results stay behind showInputOutput. When off, a round is
  #   # named only where the conversation's messages can be matched to the trace.
  #   showToolNames: false
  #   # Observations read per request (1-10000); older records load on demand.
  #   maxRecords: 1000
  #   # Characters kept from each input, output and metadata value (1-1000000).
  #   maxContentLength: 50000
  #   # Trace reads one user may start per minute (1-1000).
  #   requestsPerMinute: 30
  #   # Budget for each request to Langfuse, in milliseconds (1000-300000).
  #   requestTimeoutMs: 10000
  # Tools pinned to the prompt bar by default for all users.
  # Only seeds the initial state — once a user pins/unpins a tool, their choice is kept.
  # Valid tool keys: artifacts, execute_code, web_search, file_search, skills.
  # Use 'mcp' (or a specific MCP server name) to pin the MCP servers dropdown.
  # When omitted, tools start unpinned and the MCP dropdown keeps its default (pinned).
  # defaultPinnedTools:
  #   - 'artifacts'
  #   - 'execute_code'
  #   - 'mcp'
  # Remote Agents configuration
  # Controls user permissions for remote agents with external API support
  # remoteAgents:
  #   use: false
  #   create: false
  #   share: false
  #   public: false
  # MCP Servers configuration example
  # Shared Links configuration
  # Controls user permissions for shared links (e.g. sharing conversations via link)
  # sharedLinks:
  #   create: false
  #   share: true
  #   public: true # Allows users to toggle "share with everyone" for their links. Whether anonymous access is permitted is controlled by ALLOW_SHARED_LINKS_PUBLIC.
  #   snapshotFiles: true # Snapshot files referenced by a shared chat so viewers can preview/download them via the link. Enabled by default; the SHARED_LINKS_SNAPSHOT_FILES env var overrides this.
  # mcpServers:
  #   # Poll only while MCP controls are visible, in milliseconds (0 disables polling).
  #   toolsRefreshInterval: 300000
  #   statusRefreshInterval: 30000
  # Controls user permissions for MCP (Model Context Protocol) server management
  # - use: Allow users to use configured MCP servers
  # - create: Allow users to create and manage new MCP servers
  # - share: Allow users to share MCP servers with other users
  # - public: Allow users to share MCP servers publicly (with everyone)

  # Creation / edit MCP server config Dialog config example
  # trustCheckbox:
  #   label:
  #     en: 'I understand and I want to continue'
  #     de: 'Ich verstehe und möchte fortfahren'
  #     de-DE: 'Ich verstehe und möchte fortfahren' # You can narrow translation to regions like (de-DE or de-CH)
  #   subLabel:
  #     en: |
  #       Librechat hasn't reviewed this MCP server. Attackers may attempt to steal your data or trick the model into taking unintended actions, including destroying data. <a href="https://google.de" target="_blank"><strong>Learn more.</strong></a>
  #     de: |
  #       LibreChat hat diesen MCP-Server nicht überprüft. Angreifer könnten versuchen, Ihre Daten zu stehlen oder das Modell zu unbeabsichtigten Aktionen zu verleiten, einschließlich der Zerstörung von Daten. <a href="https://google.de" target="_blank"><strong>Mehr erfahren.</strong></a>

  # Temporary chat retention period in hours (default: 720, min: 1, max: 8760)
  # temporaryChatRetention: 1
  # Regular chat retention in hours under retentionMode: "all" (min: 1, max: 8760).
  # Defaults to the temporary chat retention policy when omitted.
  # generalChatRetention: 2160 # 90 days, independently of temporary chats
  # Existing stored deadlines are not migrated when these settings change.
  # Retention mode: "all" applies expiry to all data types, "temporary" (default) only to temporary chats
  # Before switching from "all" back to "temporary", remove retention deadlines from non-temporary data
  # that should stop expiring:
  # db.conversations.updateMany({ isTemporary: false, expiredAt: { $ne: null } }, { $unset: { expiredAt: 1 } })
  # db.messages.updateMany({ isTemporary: false, expiredAt: { $ne: null } }, { $unset: { expiredAt: 1 } })
  # MongoDB does not drop superseded indexes automatically. After upgrading, old Meili indexes
  # such as "_meiliIndex_1_expiredAt_1" can be dropped from conversations/messages once the new
  # "_meiliIndex_1_isTemporary_1_expiredAt_1" indexes exist.
  # retentionMode: "temporary"
  # Set retainAgentFiles to true to keep persistent agent resource files from expiring under
  # retentionMode: "all"; non-agent files still expire.
  # retainAgentFiles: false

