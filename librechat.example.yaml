# Web Search Configuration (optional)
# webSearch:
#   # Jina Reranking Configuration
#   jinaApiKey: '${JINA_API_KEY}'  # Your Jina API key
#   jinaApiUrl: '${JINA_API_URL}'  # Custom Jina API URL (optional, defaults to https://api.jina.ai/v1/rerank)
#   # Other rerankers
#   cohereApiKey: '${COHERE_API_KEY}'
#   # Search providers
#   serperApiKey: '${SERPER_API_KEY}'
#   searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
#   searxngApiKey: '${SEARXNG_API_KEY}'
#   # Tavily (search provider and/or scraper)
#   tavilyApiKey: '${TAVILY_API_KEY}'
#   # Keenable (search provider; keyless by default, a key only lifts rate limits)
#   keenableApiKey: '${KEENABLE_API_KEY}'
#   # Content scrapers
#   firecrawlApiKey: '${FIRECRAWL_API_KEY}'
#   firecrawlApiUrl: '${FIRECRAWL_API_URL}'
#   # Outbound search and scrape requests are validated at connect time against
#   # their resolved IP and blocked from reaching private, loopback, link-local,
#   # or cloud-metadata space. `allowedAddresses` is an SSRF exemption list, NOT a
#   # strict whitelist: hostname/IP + port pairs listed here bypass that block for
#   # one deliberately-private endpoint (for example a self-hosted SearXNG
#   # instance); public destinations continue to work normally.
#   #
#   # Entries must include a port: `host:port`, `private.ip:port`, or `[ipv6]:port`.
#   # Do not use URLs, paths, CIDR ranges, bare hosts/IPs, or public IP literals.
#   # A hostname entry trusts whatever IP that name resolves to on the listed port,
#   # so only list hosts you fully control and whose DNS cannot be repointed by an
#   # attacker. Listing an attacker-controllable or DNS-rebindable host re-opens the
#   # private-address path this guard closes. Prefer literal IPs where you can.
#   #
#   # Self-hosted endpoints need an entry. A private destination such as
#   # `http://searxng:8080`, `http://firecrawl:3002`, or `http://127.0.0.1:8080` is
#   # blocked once this guard is active, so list it here or those requests will fail.
#   #
#   # A proxy from `HTTP_PROXY`, `HTTPS_PROXY`, or `ALL_PROXY` (either case) is
#   # exempted automatically and needs no entry. That exemption is applied to the
#   # whole tool rather than per destination, so a host `NO_PROXY` sends direct also
#   # carries it. Note that when a proxy carries the request the proxy resolves the
#   # destination, so destination egress policy is the proxy's to enforce, and for
#   # https targets the proxy's own tunnel replaces this guard entirely.
#   # allowedAddresses:
#   #   - 'searxng:8080'
#   #   - '127.0.0.1:8080'
#
# Tavily as both search and scraper provider example:
# webSearch:
#   searchProvider: tavily
#   scraperProvider: tavily
#   tavilyApiKey: '${TAVILY_API_KEY}'
#   # Optional: custom API URLs (defaults to https://api.tavily.com/search and https://api.tavily.com/extract)
#   # tavilySearchUrl: '${TAVILY_SEARCH_URL}'
#   # tavilyExtractUrl: '${TAVILY_EXTRACT_URL}'
#   tavilySearchOptions:
#     searchDepth: basic        # 'basic', 'advanced', 'fast', or 'ultra-fast' (default: basic)
#     maxResults: 5             # 1-20 results per search (default: 5)
#     topic: general            # 'general', 'news', or 'finance'
#     # includeAnswer: basic    # Include answer summary: true, 'basic', or 'advanced'
#     # includeRawContent: markdown # Include raw content: true, 'markdown', or 'text'
#     # includeImages: true     # Include images in results
#     # includeFavicon: true    # Include favicon URL for each result
#     # chunksPerSource: 3      # Chunks per source, only with 'advanced' depth (1-3)
#     # safeSearch: false       # Override Tavily safe_search filtering (true is enterprise-only)
#     # includeDomains:         # Restrict search to specific domains (max 300)
#     #   - 'example.com'
#     #   - 'docs.example.com'
#     # excludeDomains:         # Exclude specific domains from results (max 150)
#     #   - 'spam.com'
#     # timeRange: week         # 'day', 'week', 'month', or 'year'
#     # timeout: 15000          # HTTP request timeout in milliseconds (max 120000)
#   tavilyScraperOptions:
#     extractDepth: basic       # 'basic' (1 credit/5 URLs) or 'advanced' (2 credits/5 URLs, more thorough)
#     # includeImages: false    # Include images extracted from URLs
#     # includeFavicon: false   # Include favicon URL for each result
#     # format: markdown        # 'markdown' (default) or 'text' (plain text, may increase latency)
#     # timeout: 15000          # HTTP request timeout in milliseconds (max 120000); Tavily Extract receives seconds clamped to 1-60
#
# Keenable as both search provider and scraper example — a fully keyless web
# search stack: no API key for any of the three categories. The public search and
# fetch endpoints are rate-limited; a key only lifts the cap.
# webSearch:
#   searchProvider: keenable
#   scraperProvider: keenable
#   rerankerType: none          # Rerankers all require a key; 'none' skips reranking
#   # keenableApiKey: '${KEENABLE_API_KEY}'   # Optional: a key only lifts rate limits (public endpoints used when unset)
#   # keenableApiUrl: '${KEENABLE_API_URL}'   # Optional: search API URL override (fetch uses KEENABLE_FETCH_URL)
#   keenableSearchOptions:
#     maxResults: 5             # 1-20 results per search (default: 8)
#     # site: example.com       # Restrict search to a single domain
#     # attributionTitle: LibreChat  # X-Keenable-Title header sent with each request
#     # timeout: 15000          # HTTP request timeout in milliseconds (max 120000)
#   keenableScraperOptions:
#     # attributionTitle: LibreChat  # X-Keenable-Title header sent with each fetch
#     timeout: 15000            # HTTP request timeout in milliseconds (max 120000)
#
# Keenable search paired with another scraper (Firecrawl here) also works; each
# category is configured independently:
# webSearch:
#   searchProvider: keenable
#   scraperProvider: firecrawl
#   firecrawlApiKey: '${FIRECRAWL_API_KEY}'
#
# The reverse (someone else's search, Keenable as the scraper) also works. Pin
# the stack for every user as shown below, or leave the providers unpinned so
# each user can save this same keyless combination in the API-key dialog:
# webSearch:
#   searchProvider: searxng
#   searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
#   scraperProvider: keenable
#   rerankerType: none
#
# SearXNG as the search provider example:
# webSearch:
#   searchProvider: searxng
#   searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
#   # searxngApiKey: '${SEARXNG_API_KEY}'
#   searxngSearchOptions:
#     # Engines your instance should query. Accepts a comma-separated string or a list.
#     # Defaults to 'google,bing,duckduckgo'; DuckDuckGo serves CAPTCHAs to most
#     # self-hosted instances, so override it when results come back empty.
#     #
#     # Names must match engines enabled on your own instance. SearXNG ignores an
#     # engine it does not know instead of reporting an error, so a typo or a
#     # disabled engine shows up as fewer results rather than a failure. Check the
#     # enabled list at https://your-instance/config before setting this.
#     engines:
#       - google
#       - bing
#       - startpage
#       - qwant
#     # language: en            # Result language code (default: 'all')
#     # timeRange: month        # 'day', 'month', or 'year'
#     # timeout: 10000          # HTTP request timeout in milliseconds (1-120000, default: 10000)

# Memory configuration for user memories
# memory:
#   # (optional) Disable memory functionality
#   disabled: false
#   # (optional) Restrict memory keys to specific values to limit memory storage and improve consistency
#   validKeys: ["preferences", "work_info", "personal_info", "skills", "interests", "context"]
#   # (optional) Maximum token limit for stored memory values
#   tokenLimit: 10000
#   # (optional) Maximum tokens from recent chat sent to the memory agent before truncation
#   maxInputTokens: 12000
#   # (optional) Enable personalization features (defaults to true if memory is configured)
#   # When false, users will not see the Personalization tab in settings
#   personalize: true
#   # (optional) Memory agent configuration for automatic memory updates from chat messages.
#   # If omitted, users can still create, edit, delete, and reference memories manually.
#   agent:
#     # Explicitly enables automatic memory updates from chat messages.
#     enabled: true
#     # Option 1: Use existing agent by ID
#     id: "your-memory-agent-id"
#     # Option 2: Define agent inline
#     # provider: "openai"
#     # model: "gpt-4o-mini"
#     # instructions: "You are a memory management assistant. Store and manage user information accurately."
#     # model_parameters:
#     #   temperature: 0.1

# Apply opt-in content filters to source-classified submitted and reusable content.
# `filters` is base-config-only: database overrides and tombstones cannot add,
# change, or remove this policy for individual users, groups, or roles.
# In multi-replica deployments, use a coordinated deploy or restart and verify
# every replica loaded the same base config before considering policy active;
# local cache invalidation is not a rollout barrier.
# Omit `filters` or a source to leave that scope disabled. Omitting a source's
# `pii` block disables its source-aware detectors; for messages, `inspect` can
# still change how an enabled legacy `messageFilter.pii` attributes old rows.
# Omit `fields` to filter every supported field for an enabled source.
# `starterPatterns` and `customPatterns` can be configured independently
# under any source so each input surface can use a different policy. Starter
# ids are closed to the catalog below. Custom regexes use bounded,
# linear-time syntax; unsupported constructs are rejected at config load.
# `action` defaults to `block`. Set it to `audit` for a shadow rollout that
# records raw-free findings without rejecting or modifying content. Redaction
# is intentionally not an action yet because safe replacement requires a
# mutation-aware boundary and match spans; configuring an unsupported action
# is rejected rather than silently treated as enforcement.
# Omit `starterPatterns` to enable the full starter catalog; set it to `[]`
# to disable starters while retaining any configured custom patterns.
# Enabling or changing this policy does not rewrite or delete stored records.
# Current policy rechecks protected fields when they are resubmitted and when
# records are copied, shared, or become model-bound. Safe partial metadata edits
# can succeed so records remain repairable, but persisted protected fields remain
# unusable on those paths until repaired. Protected prompt or preset fields may
# be blanked with `contentFilterBlocked: true` in management views. Prompt-group
# metadata blocked by policy returns an explicit error on direct GET, while
# collection and reuse responses omit that group.
# Automatic memory maintenance may log and skip a rejected background update
# while allowing the main chat response to continue.
# Legacy assistant rows without provenance default to `model_output`, preserving
# legacy behavior. Inventory or migrate those records before relying on retroactive
# enforcement. Opting into `inspect` treats otherwise unattributed assistant content,
# including selected attachment projections, as submitted; explicit model provenance
# remains exempt.
# Roll out strict file inspection deliberately: `uninspectable: block` can make
# older opaque files unavailable for reuse until inspectable text is present.
# filters:
#   messages:
#     unattributedAssistantContent: model_output # `model_output` (default) or `inspect`
#     pii:
#       action: audit # `block` (default) or `audit`
#       fields: [name, text, summary, quote, answer, decision_response, decision_reason, content_part, attachment_reference, assembled_context]
#       starterPatterns: [sk_prefix, bearer_header, api_key_header]
#       customPatterns:
#         - id: organization_identifier
#           label: Organization identifier
#           regex: "ORG-[A-Z0-9]{12}"
#   prompts:
#     pii:
#       fields: [name, description, oneliner, category, command, text, preset_text, system, context, instructions, additional_instructions, greeting, example_input, example_output]
#   agentInstructions:
#     pii:
#       fields: [name, category, description, instructions, additional_instructions, edge_description, edge_prompt, edge_prompt_key, artifacts, support_contact_name, support_contact_email]
#   conversationStarters:
#     pii:
#       fields: [text]
#   conversationTitles:
#     pii:
#       fields: [title]
#   feedback:
#     pii:
#       fields: [text]
#   skills:
#     pii:
#       fields: [name, display_title, description, category, frontmatter, instructions, imported_text, file_name, file_text]
#   memories:
#     pii:
#       fields: [key, value, summary]
#   files:
#     pii:
#       fields: [name, content, extracted_text, transcript, uri]
#       # `allow` is the compatibility default. `block` rejects opaque or
#       # oversized selected file content before provider/storage side effects.
#       uninspectable: block
#   toolArguments:
#     pii:
#       fields: [name, arguments, output]
#   modelParameters:
#     pii:
#       fields: [stop, request_fields, response_format, metadata]
#   actionMetadata:
#     pii:
#       fields: [raw_spec, domain, privacy_policy_url, authorization_type, custom_auth_header, authorization_content_type, authorization_url, client_url, scope, token_exchange_method, api_key, oauth_client_id, oauth_client_secret]

# Legacy message-only filter configuration. Existing deployments can continue
# using this shape while migrating message policy into `filters.messages`.
# When both shapes are configured, both policies apply. Prefer
# `filters.messages` for centrally managed source-aware policy.
# messageFilter:
#   pii:
#     # (optional) Pick a subset of the starter catalog by id; omit to
#     # enable all starters (sk_prefix, bearer_header, api_key_header).
#     starterPatterns: [sk_prefix, bearer_header, api_key_header]
#     # (optional) Operator-defined patterns. Each entry needs id, label,
#     # and a regex in RE2 syntax and semantics (RE2 is a linear-time engine
#     # with no catastrophic backtracking; a few escapes such as \p, \A, and
#     # \s differ from JavaScript). Backreferences and lookaround are not
#     # supported; the regex is validated against the RE2 engine at config
#     # load time and a pattern it cannot compile is rejected.
#     customPatterns:
#       - id: anthropic_api_key
#         label: Anthropic API key
#         regex: "sk-ant-[A-Za-z0-9_-]{20,}"

# ACL writes retry only conflicts on an individual document.
# permissions:
#   maxWriteAttempts: 3 # Integer 1-100, including the first attempt.
