# Tchat — LibreChat configuration for chat.tensorgrid.space
#
# Bind-mounted to /app/librechat.yaml. The upstream repo gitignores
# `librechat.yaml`, so the real config lives here under deploy/tchat/ where
# `git merge upstream/main` will never touch it.
#
# Every model call leaves through the Tchat broker, which swaps the shared
# ingress key for the signed-in user's own Models Gateway token before
# forwarding to api.tensorgrid.space. Users never see that token and cannot
# point Tchat at any other provider.

version: 1.3.17
cache: true

interface:
  customWelcome: 'Welcome to Tchat — TensorGrid models, billed to your TensorGrid credit.'
  privacyPolicy:
    externalUrl: 'https://tensorgrid.space/privacy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://tensorgrid.space/terms'
    openNewTab: true
  # Users pick any model the Gateway catalog offers. Safe to enable because
  # `modelSpecs.enforce` is off; with it on, the UI could offer a selection
  # carrying no spec, which the server then rejects as "No model spec selected".
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  fileSearch: true
  fileCitations: true
  # Grants every role the web search permission. The tool itself is pinned on
  # by `webSearch.alwaysOn` below, so there is no toggle for users to flip.
  webSearch: true
  feedback: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  # No third-party agent marketplace: everything Tchat can reach must route
  # through the TensorGrid endpoints below.
  marketplace:
    use: false

# Web search, backed by TinyFish (docs.tinyfish.ai) through the broker.
#
# LibreChat has no TinyFish provider, so the broker speaks Tavily's API on
# /tinyfish/tavily/* and translates each call to TinyFish Search and Fetch. The
# TinyFish key lives only in the broker (TINYFISH_API_KEY); this side presents
# the same shared ingress key it uses for inference. Every setting is pinned
# here, so users get no provider picker and no API-key dialog, and `alwaysOn`
# equips the tool on every chat, whatever the model, with the toggle hidden.
webSearch:
  alwaysOn: true
  searchProvider: 'tavily'
  scraperProvider: 'tavily'
  # Search results arrive ranked; a reranker would be a third provider and key.
  rerankerType: 'none'
  tavilyApiKey: '${TCHAT_BROKER_SHARED_KEY}'
  # TAVILY_SEARCH_URL / TAVILY_EXTRACT_URL point at the broker; they are set in
  # compose.production.yml, next to the service they name.
  tavilySearchUrl: '${TAVILY_SEARCH_URL}'
  tavilyExtractUrl: '${TAVILY_EXTRACT_URL}'
  # The broker is a private address, which the web-search SSRF guard refuses
  # unless it is named here.
  allowedAddresses:
    - 'tchat-broker:8081'

# `web_fetch`: read a page the user links to. The search tool above only opens
# pages its own search returned, so this is the one way to fetch a given URL.
# The broker serves it as a one-tool MCP server over the same TinyFish key.
mcpServers:
  web-fetch:
    type: 'streamable-http'
    url: '${TCHAT_BROKER_ORIGIN}/tinyfish/mcp'
    headers:
      Authorization: 'Bearer ${TCHAT_BROKER_SHARED_KEY}'
    title: 'Web fetch'
    description: 'Fetch a web page by URL and read its content.'
    # Equipped on every chat (fork option), and so kept out of the MCP picker,
    # where a toggle would do nothing.
    alwaysOn: true
    chatMenu: false
    startup: true
    timeout: 120000

mcpSettings:
  # As for web search: the MCP SSRF guard refuses private addresses, and
  # web-fetch lives on the broker. Naming it here keeps that guard on for every
  # other server, where `allowedDomains` would switch it off.
  allowedAddresses:
    - 'tchat-broker:8081'

registration:
  # OpenID is the only social provider Tchat will ever accept, and it points at
  # TensorGrid. Until the Django IdP exists this list is inert because
  # ALLOW_SOCIAL_LOGIN is false — see deploy/tchat/OIDC.md.
  socialLogins: ['openid']

endpoints:
  # Only these two exist. Built-in providers are additionally switched off with
  # `ENDPOINTS=agents`, and no provider API key is ever present in the
  # environment, so there is nothing for a user to select or configure.
  custom:
    - name: 'TensorGrid'
      apiKey: '${TCHAT_BROKER_SHARED_KEY}'
      baseURL: '${TCHAT_BROKER_BASE_URL}'
      # Resolved per request from the signed-in LibreChat user. The broker
      # trades these for that user's Gateway token; it refuses the request
      # outright when they are absent.
      headers:
        X-Tchat-User-Id: '{{LIBRECHAT_USER_ID}}'
        X-Tchat-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
        X-Tchat-User-Openid: '{{LIBRECHAT_USER_OPENIDID}}'
      models:
        # Live from the Gateway catalog via /v1/models through the broker, so
        # adding a model in the Gateway admin publishes it here with no redeploy.
        fetch: true
        # Shown before the first successful fetch, and whenever the Gateway is
        # unreachable. Every id below is verified present in the catalog;
        # embedding and transcription models are deliberately left out because
        # they cannot serve a chat completion.
        default:
          - 'gpt-6-luna'
          - 'gpt-5.6-terra'
          - 'gpt-5.6-sol'
          - 'gpt-5.6-luna'
          - 'gpt-5.5'
          - 'gpt-5.4'
          - 'gpt-5.4-mini'
          - 'claude-opus-5'
          - 'claude-sonnet-5'
          - 'claude-haiku-4-5'
          - 'deepseek-v4-flash'
          - 'deepseek-ai/deepseek-v4-pro-0813'
          - 'moonshotai/kimi-k3'
          - 'minimaxai/minimax-m3'
          - 'nvidia/nemotron-3-super-120b-a12b'
          - 'openai/gpt-oss-120b'
          - 'openai/gpt-oss-20b'
          - 'Qwen/Qwen3.6-35B-A3B-FP8'
          - 'Qwen3.8-27B'
      titleConvo: true
      # Titles bill the same as any other call, so they use the cheapest model
      # in the catalog rather than whatever the conversation is running on.
      titleModel: 'gpt-5.4-mini'
      modelDisplayLabel: 'TensorGrid'
      iconURL: '/images/tchat-mark.svg'

    - name: 'TensorGrid-Claude'
      # Native Anthropic /v1/messages against the Gateway's Claude-compatible
      # relay. The Anthropic client authenticates with x-api-key, which the
      # broker accepts alongside bearer tokens.
      provider: 'anthropic'
      apiKey: '${TCHAT_BROKER_SHARED_KEY}'
      # No /v1 here, unlike the OpenAI endpoint above: the Anthropic SDK appends
      # /v1/messages to the base URL, so TCHAT_BROKER_BASE_URL would produce
      # /v1/v1/messages and every Claude request would 404 at the broker.
      baseURL: '${TCHAT_BROKER_ORIGIN}'
      headers:
        anthropic-version: '2023-06-01'
        X-Tchat-User-Id: '{{LIBRECHAT_USER_ID}}'
        X-Tchat-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
        X-Tchat-User-Openid: '{{LIBRECHAT_USER_OPENIDID}}'
      models:
        # The Anthropic provider has no /models convention to auto-fetch, so
        # these are listed explicitly and must exist in the Gateway catalog.
        fetch: false
        default:
          - 'claude-opus-5'
          - 'claude-sonnet-5'
          - 'claude-fable-5'
          - 'claude-opus-4-8'
          - 'claude-opus-4-7'
          - 'claude-opus-4-6'
          - 'claude-sonnet-4-6'
          - 'claude-haiku-4-5'
      titleConvo: true
      titleModel: 'claude-haiku-4-5'
      modelDisplayLabel: 'TensorGrid Claude'
      iconURL: '/images/tchat-mark.svg'

# Starting points, not a whitelist. Provider lockdown is done by there being
# exactly two endpoints, both aimed at the broker, with no provider API key
# anywhere in the deployment — `enforce` would additionally freeze the model
# list, which stops users choosing from the Gateway catalog they are paying for.
modelSpecs:
  enforce: false
  prioritize: true
  addedEndpoints: []
  list:
    - name: 'tensorgrid-default'
      label: 'TensorGrid'
      description: 'General-purpose chat on TensorGrid models, billed to your TensorGrid credit.'
      default: true
      preset:
        endpoint: 'TensorGrid'
        model: 'gpt-6-luna'

    - name: 'tensorgrid-claude'
      label: 'TensorGrid Claude'
      description: 'Anthropic Claude models served through the TensorGrid gateway.'
      preset:
        endpoint: 'TensorGrid-Claude'
        model: 'claude-sonnet-5'

  # Image models offered behind the chat input's Image Gen toggle. Deliberately
  # not in `list` above: those are chat models and populate the model selector,
  # and a spec hidden from that menu never reaches the client at all. Adding a
  # model the Gateway already serves is three lines here — no image rebuild,
  # since this file is Komodo-tracked.
  #
  # `protocol: gemini` routes through the tool that speaks Google's own API,
  # which the Gateway relays natively. It is required for `gemini-*-image`
  # models: the Gateway's OpenAI image endpoint serves the `imagen` family only.
  #
  # Only models verified reachable are listed. The catalog also carries
  # `gpt-image-2-4k` (no channel serves it for group `pro`) and
  # `gemini-3.1-flash-image-c` (tokens have no access to it); add them here once
  # the Gateway grants them, because an entry that 403s is worse than no entry.
  # Note that /v1/models is per user, so catalog visibility is not access.
  imageList:
    - name: 'gpt-image'
      label: 'GPT Image'
      description: "OpenAI's image model. Generation and editing."
      model: 'gpt-image-2'
      default: true

    - name: 'gemini-image'
      label: 'Gemini Image'
      description: "Google's Gemini 3 Pro image model."
      model: 'gemini-3-pro-image-c'
      protocol: 'gemini'

    # LinkAPI's image lineup (2026-09-29), each verified end to end through the
    # Gateway with this tool's own request shape. `-c`/`-h` and the Gemini
    # `*-preview`/`-lite`/`2.5` entries bill per image; the rest bill by tokens.
    # LinkAPI answers edits and `gpt-image-2.5-c` with a hosted URL, which the
    # OpenAI image tool now downloads. Left out: token-billed
    # `gpt-image-2.5-sunburst` / `-flare`, whose LinkAPI group returns 503
    # "上游负载已饱和" on nearly every request; and `gpt-image-2-c` ("GPT Image 2
    # · Draft", removed 2026-09-29), which took 126 s in a direct test and held a
    # Tchat request for 10 min before LinkAPI answered 504. A chat that still
    # selects it falls back to the default entry.
    - name: 'gpt-image-2-hd'
      label: 'GPT Image 2 · HD'
      description: 'Higher-detail GPT Image 2, flat price per image.'
      model: 'gpt-image-2-h'

    - name: 'gpt-image-2-5'
      label: 'GPT Image 2.5'
      description: "OpenAI's GPT Image 2.5, flat price per image."
      model: 'gpt-image-2.5-c'

    - name: 'gpt-image-2-5-sunburst'
      label: 'GPT Image 2.5 Sunburst'
      description: 'GPT Image 2.5 Sunburst variant, flat price per image.'
      model: 'gpt-image-2.5-sunburst-h'

    - name: 'gpt-image-2-5-flare'
      label: 'GPT Image 2.5 Flare'
      description: 'GPT Image 2.5 Flare variant, flat price per image.'
      model: 'gpt-image-2.5-flare-h'

    - name: 'gemini-3-pro-image'
      label: 'Gemini 3 Pro Image · per token'
      description: 'Gemini 3 Pro image model, billed by output tokens instead of per image.'
      model: 'gemini-3-pro-image'
      protocol: 'gemini'

    - name: 'gemini-3-pro-image-preview'
      label: 'Gemini 3 Pro Image Preview'
      description: 'Preview release of Gemini 3 Pro image, flat price per image.'
      model: 'gemini-3-pro-image-preview'
      protocol: 'gemini'

    - name: 'gemini-3-1-flash-image'
      label: 'Gemini 3.1 Flash Image'
      description: 'Faster, cheaper Gemini image model, billed by output tokens.'
      model: 'gemini-3.1-flash-image'
      protocol: 'gemini'

    - name: 'gemini-3-1-flash-image-preview'
      label: 'Gemini 3.1 Flash Image Preview'
      description: 'Preview release of Gemini 3.1 Flash image, billed by output tokens.'
      model: 'gemini-3.1-flash-image-preview'
      protocol: 'gemini'

    - name: 'gemini-3-1-flash-lite-image'
      label: 'Gemini 3.1 Flash Lite Image'
      description: 'Lightest Gemini image model, flat price per image.'
      model: 'gemini-3.1-flash-lite-image'
      protocol: 'gemini'

    - name: 'gemini-2-5-flash-image'
      label: 'Gemini 2.5 Flash Image'
      description: 'Previous-generation Gemini Flash image model, flat price per image.'
      model: 'gemini-2.5-flash-image'
      protocol: 'gemini'

