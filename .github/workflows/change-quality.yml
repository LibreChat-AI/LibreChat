name: Change Quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare with
        default: origin/dev
        type: string
      scope:
        description: Test workspace (all or a workspace name)
        default: data-schemas
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALITY_BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/dev' }}
  QUALITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify quality tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Check reporter types
        run: >-
          npx --no-install tsc --noEmit --target ES2023 --module NodeNext
          --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck
          --strict --types node scripts/quality/*.mts
      - name: Test change selection and metrics
        run: node --test scripts/crap.test.mts scripts/quality/*.test.mts

  select:
    name: Select changed source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.select.outputs.workspaces }}
      hasChanges: ${{ steps.select.outputs.hasChanges }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - name: Select workspaces
        id: select
        env:
          QUALITY_SCOPE: ${{ inputs.scope || 'data-schemas' }}
        run: node scripts/quality/changes.mts --base "$QUALITY_BASE" --head "$QUALITY_HEAD" --scope "$QUALITY_SCOPE"

  reports:
    name: ${{ matrix.task.check == 'risk' && 'Change risk' || format('Mutation testing {0}/4', matrix.task.shard) }} (${{ matrix.workspace }})
    needs: [select, verify]
    if: needs.select.outputs.hasChanges == 'true'
    runs-on: ubuntu-latest
    # Whole edited database functions can produce thousands of mutation cases.
    timeout-minutes: ${{ matrix.task.check == 'mutation' && 240 || 45 }}
    defaults:
      run:
        working-directory: source
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.select.outputs.workspaces) }}
        task:
          - { check: risk, shard: 0 }
          - { check: mutation, shard: 1 }
          - { check: mutation, shard: 2 }
          - { check: mutation, shard: 3 }
          - { check: mutation, shard: 4 }
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URI: redis://127.0.0.1:6379
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_HEAD }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out quality tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            tooling/package-lock.json
      - run: npm ci
      - name: Install quality tooling
        working-directory: tooling
        run: npm ci --ignore-scripts --workspaces=false
      - name: Build shared packages
        run: |
          if [ "$QUALITY_SCOPE" = data-schemas ]; then
            npm run build:data-provider
          else
            npm run build:packages
          fi
        env:
          QUALITY_SCOPE: ${{ inputs.scope || 'data-schemas' }}
      - name: Generate advisory report
        env:
          QUALITY_WORKSPACE: ${{ matrix.workspace }}
          QUALITY_CHECK: ${{ matrix.task.check }}
          QUALITY_SHARD: ${{ matrix.task.shard }}
        run: |
          args=()
          if [ "$QUALITY_CHECK" = mutation ]; then
            args+=(--shard "$QUALITY_SHARD")
          fi
          node ../tooling/scripts/quality/run.mts --base "$QUALITY_BASE" --head "$QUALITY_HEAD" \
            --workspace "$QUALITY_WORKSPACE" --check "$QUALITY_CHECK" "${args[@]}"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: change-${{ matrix.task.check }}-${{ matrix.workspace }}-${{ github.event.pull_request.head.sha || github.sha }}${{ matrix.task.check == 'mutation' && format('-shard-{0}', matrix.task.shard) || '' }}
          path: source/coverage/changes/${{ matrix.workspace }}/${{ matrix.task.check }}${{ matrix.task.check == 'mutation' && format('-{0}', matrix.task.shard) || '' }}/
          if-no-files-found: warn
          retention-days: 14

  mutation-summary:
    name: Mutation report (${{ matrix.workspace }})
    needs: [select, reports]
    if: always() && needs.select.outputs.hasChanges == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.select.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          pattern: change-mutation-${{ matrix.workspace }}-${{ env.QUALITY_HEAD }}-shard-*
          path: coverage/shards
      - name: Verify and combine mutation results
        env:
          QUALITY_WORKSPACE: ${{ matrix.workspace }}
        run: >-
          node scripts/quality/merge.mts --directory coverage/shards
          --workspace "$QUALITY_WORKSPACE"
          --head "$QUALITY_HEAD"
          --prefix "change-mutation-$QUALITY_WORKSPACE-$QUALITY_HEAD-"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: change-mutation-${{ matrix.workspace }}-${{ env.QUALITY_HEAD }}
          path: coverage/changes/${{ matrix.workspace }}/mutation/
          if-no-files-found: warn
          retention-days: 14
