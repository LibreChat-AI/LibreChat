name: Change Quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare with
        default: origin/dev
        type: string
      scope:
        description: Test workspace (all or a workspace name)
        default: data-schemas
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALITY_BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/dev' }}
  QUALITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify quality tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - name: Check reporter types
        run: >-
          npx --no-install tsc --noEmit --target ES2023 --module NodeNext
          --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck
          --strict --types node scripts/quality/*.mts
      - name: Test change selection and metrics
        run: node --test scripts/crap.test.mts scripts/quality/*.test.mts

  select:
    name: Select changed source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.select.outputs.workspaces }}
      hasChanges: ${{ steps.select.outputs.hasChanges }}
      postgresChanged: ${{ steps.postgres.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
      - name: Select workspaces
        id: select
        env:
          QUALITY_SCOPE: ${{ inputs.scope || 'data-schemas' }}
        run: node scripts/quality/changes.mts --base "$QUALITY_BASE" --head "$QUALITY_HEAD" --scope "$QUALITY_SCOPE"

      - name: Select PostgreSQL schema and lifecycle changes
        id: postgres
        run: |
          if git diff --name-only "$QUALITY_BASE...$QUALITY_HEAD" | grep -Eq '^(packages/data-schemas/src/(postgres/|types/favorite|methods/(favorite|index))|packages/api/src/app/(persistence|postgres)|packages/data-provider/src/config|api/(models/index|server/(index|experimental))|config/(postgres|delete-user)|packages/data-schemas/jest.postgres|package-lock.json|.github/workflows/change-quality.yml)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  postgres:
    name: PostgreSQL 16 contracts and readiness
    needs: [select]
    if: needs.select.outputs.postgresChanged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_URL: postgresql://postgres@127.0.0.1:5432/postgres
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run build:data-provider && npm run build:data-schemas && npm run build:api
      - run: npm run test:postgres --workspace packages/data-schemas
      - run: npx --no-install jest src/app/persistence.spec.ts src/app/postgres.spec.ts src/favorites/handlers.spec.ts src/user/erasure.spec.ts --coverage=false --runInBand
        working-directory: packages/api
      - run: npx --no-install jest --config config/jest.config.js --runTestsByPath config/__tests__/delete-user.recovery.spec.js --coverage=false --runInBand

  reports:
    name: ${{ matrix.report.check == 'risk' && format('Change risk ({0})', matrix.workspace) || format('Mutation shard {0}/3 ({1})', matrix.report.shard, matrix.workspace) }}
    needs: [select, verify]
    if: needs.select.outputs.hasChanges == 'true'
    runs-on: ubuntu-latest
    # Whole edited database functions can produce thousands of mutation cases.
    timeout-minutes: ${{ matrix.report.check == 'mutation' && 240 || 45 }}
    defaults:
      run:
        working-directory: source
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.select.outputs.workspaces) }}
        report:
          - { check: risk, shard: 0 }
          - { check: mutation, shard: 1 }
          - { check: mutation, shard: 2 }
          - { check: mutation, shard: 3 }
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_URL: postgresql://postgres@127.0.0.1:5432/postgres
      REDIS_URI: redis://127.0.0.1:6379
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_HEAD }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out quality tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            tooling/package-lock.json
      - run: npm ci
      - name: Install quality tooling
        working-directory: tooling
        run: npm ci --ignore-scripts --workspaces=false
      - name: Build shared packages
        run: |
          if [ "$QUALITY_SCOPE" = data-schemas ]; then
            npm run build:data-provider
          else
            npm run build:packages
          fi
        env:
          QUALITY_SCOPE: ${{ inputs.scope || 'data-schemas' }}
      # The action comes from the workflow revision like the rest of the tooling; the binary
      # is the one the measured source's own install asks for.
      - name: Provision MongoDB memory-server binary
        uses: ./tooling/.github/actions/mongodb-binary
        with:
          working-directory: source
      - name: Generate advisory report
        env:
          QUALITY_WORKSPACE: ${{ matrix.workspace }}
          QUALITY_CHECK: ${{ matrix.report.check }}
          QUALITY_SHARD: ${{ matrix.report.shard && format('{0}/3', matrix.report.shard) || '' }}
        run: |
          args=()
          if [ -n "$QUALITY_SHARD" ]; then args+=(--shard "$QUALITY_SHARD"); fi
          node ../tooling/scripts/quality/run.mts --base "$QUALITY_BASE" --head "$QUALITY_HEAD" \
            --workspace "$QUALITY_WORKSPACE" --check "$QUALITY_CHECK" "${args[@]}"
      # The mutation job downloads the mutation shards, so a shard that is not uploaded has to
      # fail here. Nothing downloads the risk report, so losing it must not fail the job.
      - name: Upload reports
        if: always()
        continue-on-error: ${{ matrix.report.check == 'risk' }}
        uses: actions/upload-artifact@v6
        with:
          name: change-${{ matrix.report.check }}-${{ matrix.workspace }}${{ matrix.report.shard && format('-shard-{0}', matrix.report.shard) || '' }}-${{ env.QUALITY_HEAD }}
          path: source/coverage/changes/${{ matrix.workspace }}/${{ matrix.report.check }}/
          if-no-files-found: warn
          retention-days: 14

  mutation:
    name: Mutation testing (${{ matrix.workspace }})
    needs: [select, reports]
    if: always() && needs.select.result == 'success' && needs.select.outputs.hasChanges == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.select.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@v7
        with:
          pattern: change-mutation-${{ matrix.workspace }}-shard-*-${{ env.QUALITY_HEAD }}
          path: mutation-reports
      - name: Verify all mutation shards
        env:
          QUALITY_WORKSPACE: ${{ matrix.workspace }}
        run: >-
          node scripts/quality/aggregate.mts --directory mutation-reports --head "$QUALITY_HEAD"
          --workspace "$QUALITY_WORKSPACE" --count 3
          --output "coverage/changes/$QUALITY_WORKSPACE/mutation"
      - name: Require successful report jobs
        env:
          REPORT_RESULT: ${{ needs.reports.result }}
        run: test "$REPORT_RESULT" = success
      # The aggregate is a debugging aid that no job downloads: see the note on the e2e_shards
      # uploads in playwright-mock.yml.
      - uses: actions/upload-artifact@v6
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: change-mutation-${{ matrix.workspace }}-${{ env.QUALITY_HEAD }}
          path: coverage/changes/${{ matrix.workspace }}/mutation/
          if-no-files-found: warn
          retention-days: 14
