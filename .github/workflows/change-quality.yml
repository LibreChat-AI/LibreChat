name: Change Quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare with
        default: origin/dev
        type: string
      scope:
        description: Test workspace (all or a workspace name)
        default: data-schemas
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALITY_BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/dev' }}
  QUALITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify quality tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Check reporter types
        run: >-
          npx --no-install tsc --noEmit --target ES2023 --module NodeNext
          --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck
          --strict --types node scripts/quality/*.mts
      - name: Test change selection and metrics
        run: node --test scripts/crap.test.mts scripts/quality/*.test.mts

  select:
    name: Select changed source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.select.outputs.workspaces }}
      hasChanges: ${{ steps.select.outputs.hasChanges }}
      postgresChanged: ${{ steps.postgres.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - name: Select workspaces
        id: select
        env:
          QUALITY_SCOPE: ${{ inputs.scope || 'data-schemas' }}
        run: node scripts/quality/changes.mts --base "$QUALITY_BASE" --head "$QUALITY_HEAD" --scope "$QUALITY_SCOPE"

      - name: Select PostgreSQL schema and lifecycle changes
        id: postgres
        run: |
          if git diff --name-only "$QUALITY_BASE...$QUALITY_HEAD" | grep -Eq '^(packages/data-schemas/src/(postgres/|types/favorite|methods/(favorite|index))|packages/api/src/app/(persistence|postgres)|packages/data-provider/src/config|api/(models/index|server/(index|experimental))|config/(postgres|delete-user)|packages/data-schemas/jest.postgres|package-lock.json|.github/workflows/change-quality.yml)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  postgres:
    name: PostgreSQL 16 contracts and readiness
    needs: [select]
    if: needs.select.outputs.postgresChanged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_URL: postgresql://postgres@127.0.0.1:5432/postgres
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build:data-provider && npm run build:data-schemas && npm run build:api
      - run: npm run test:postgres --workspace packages/data-schemas
      - run: npx --no-install jest src/app/persistence.spec.ts src/app/postgres.spec.ts src/favorites/handlers.spec.ts src/user/erasure.spec.ts --coverage=false --runInBand
        working-directory: packages/api
      - run: npx --no-install jest --config config/jest.config.js --runTestsByPath config/__tests__/delete-user.recovery.spec.js --coverage=false --runInBand

  reports:
    name: ${{ matrix.check == 'risk' && 'Change risk' || 'Mutation testing' }} (${{ matrix.workspace }})
    needs: [select, verify]
    if: needs.select.outputs.hasChanges == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.select.outputs.workspaces) }}
        check: [risk, mutation]
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_TEST_URL: postgresql://postgres@127.0.0.1:5432/postgres
      REDIS_URI: redis://127.0.0.1:6379
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.QUALITY_HEAD }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out quality tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            tooling/package-lock.json
      - run: npm ci
      - name: Install quality tooling
        working-directory: tooling
        run: npm ci --ignore-scripts --workspaces=false
      - name: Build shared packages
        run: |
          if [ "$QUALITY_SCOPE" = data-schemas ]; then
            npm run build:data-provider
          else
            npm run build:packages
          fi
        env:
          QUALITY_SCOPE: ${{ inputs.scope || 'data-schemas' }}
      - name: Generate advisory report
        env:
          QUALITY_WORKSPACE: ${{ matrix.workspace }}
          QUALITY_CHECK: ${{ matrix.check }}
        run: >-
          node ../tooling/scripts/quality/run.mts --base "$QUALITY_BASE" --head "$QUALITY_HEAD"
          --workspace "$QUALITY_WORKSPACE" --check "$QUALITY_CHECK"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: change-${{ matrix.check }}-${{ matrix.workspace }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: source/coverage/changes/${{ matrix.workspace }}/${{ matrix.check }}/
          if-no-files-found: warn
          retention-days: 14
