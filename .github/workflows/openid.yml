name: OpenID Keycloak

on:
  pull_request:
    paths:
      - 'api/**'
      - 'client/**'
      - 'packages/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/openid.yml'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  keycloak:
    name: Keycloak (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, protocol]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx tsc -p e2e/openid/tsconfig.json
      # The browser suite launches this Chromium build, so its download stays fatal.
      - name: Install lockfile-pinned Chromium
        run: npx playwright install --no-shell chromium
      # The runner's own Chrome already brings the libraries Chromium links; the extra
      # packages are optional fonts, so an unreachable apt mirror must not fail the job.
      - name: Install optional Chromium system packages (best effort)
        timeout-minutes: 4
        continue-on-error: true
        run: .github/scripts/install-playwright-fonts.sh chromium
      - run: npm run e2e:prepare
      - run: npm run e2e:openid:keycloak -- --project=${{ matrix.suite }}
      - name: Upload test results
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: keycloak-${{ matrix.suite }}-results
          path: e2e/openid/.test-results/
          include-hidden-files: true
          retention-days: 7
