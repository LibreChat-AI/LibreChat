name: Repository Safety

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: repository-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  symlinks:
    name: Confine repository symlinks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
      - name: Test symlink guard
        run: node --test .github/scripts/check-symlinks.test.mjs
      - name: Reject out-of-bounds symlinks
        run: node .github/scripts/check-symlinks.mjs
