name: Sync Locize Translations & Create Translation PR

on:
  push:
    branches: [dev]
    paths:
      - 'client/src/locales/en/**'
  repository_dispatch:
    types: [locize/versionPublished]
  workflow_dispatch:

concurrency:
  group: locize-i18n-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-translations:
    name: Sync Translation Keys with Locize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set Up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'

      - name: Install locize CLI
        run: npm install -g locize-cli@12.2.0 --ignore-scripts --no-audit --no-fund

      # Git owns English source values. Push changed values to Locize without
      # allowing a stale checkout to delete keys that still exist remotely.
      - name: Sync Locize with Repository
        if: ${{ github.event_name == 'push' }}
        env:
          LOCIZE_API_KEY: ${{ secrets.LOCIZE_API_KEY }}
          LOCIZE_PROJECT_ID: ${{ secrets.LOCIZE_PROJECT_ID }}
        run: |
          cd client/src/locales
          locize sync --cdn-type pro --api-key "$LOCIZE_API_KEY" --project-id "$LOCIZE_PROJECT_ID" --language en --skip-delete true --update-values true

      # When triggered by repository_dispatch, skip sync step.
      - name: Skip sync step on non-push events
        if: ${{ github.event_name != 'push' }}
        run: echo "Skipping sync as the event is not a push."

  create-pull-request:
    name: Create Translation PR on Version Published
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: sync-translations
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 1. Check out the repository.
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false

      # Keep a baseline so generated changes can be checked before opening a PR.
      - name: Snapshot Repository Locales
        run: cp -R client/src/locales "$RUNNER_TEMP/locize-locale-baseline"

      # Download the latest published translation version from Locize.
      - name: Download Translations from locize
        uses: locize/download@v2
        with:
          project-id: ${{ secrets.LOCIZE_PROJECT_ID }}
          path: "client/src/locales"
          version: latest

      - name: Preserve Repository Translations Missing from locize
        run: |
          node scripts/merge-locize-download.mjs \
            --base-dir "$RUNNER_TEMP/locize-locale-baseline" \
            --current-dir client/src/locales

      - name: Restore Repository English Source
        run: cp "$RUNNER_TEMP/locize-locale-baseline/en/translation.json" client/src/locales/en/translation.json

      - name: Validate Downloaded Translations
        run: |
          node scripts/validate-locize-download.mjs \
            --base-dir "$RUNNER_TEMP/locize-locale-baseline" \
            --current-dir client/src/locales

      - name: Upload Validated Translations
        uses: actions/upload-artifact@v4
        with:
          name: locize-locales-${{ github.run_id }}
          path: client/src/locales
          if-no-files-found: error
          retention-days: 1

      # 3. Create a Pull Request using this workflow's scoped token.
      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          add-paths: |
            client/src/locales/**
          commit-message: "🌍 i18n: Update translation.json with latest translations"
          base: dev
          branch: i18n/locize-translation-update
          title: "🌍 i18n: Update translation.json with latest translations"
          body: |
            **Description**:
            - 🎯 **Objective**: Update `translation.json` with the latest translations from locize.
            - 🔍 **Details**: This PR is automatically generated upon receiving a versionPublished event with version "latest". It reflects the newest translations provided by locize.
            - ✅ **Status**: Ready for review.
          labels: "🌍 i18n"

      - name: Request Reviewer
        if: ${{ steps.create-pull-request.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
          REVIEWER: danny-avila
        run: |
          author="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')"

          if [ "$author" = "$REVIEWER" ]; then
            echo "Skipping reviewer request because $REVIEWER authored PR #$PR_NUMBER."
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$REVIEWER"
