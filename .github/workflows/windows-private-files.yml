name: Windows Private Files

on:
  pull_request:
    paths:
      - '.github/workflows/windows-private-files.yml'
      - 'packages/api/src/credentials*'
      - 'packages/api/src/agents/files/snapshots*'
      - 'packages/api/src/utils/windowsPrivate.ts'
      - 'packages/api/src/utils/windowsAcl.helper.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acl:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Verify Windows PowerShell can start
        run: |
          node -e '
            const { spawnSync } = require("node:child_process");
            const { win32 } = require("node:path");
            const cwd = process.env.SystemRoot;
            const executable = win32.join(cwd, "System32", "WindowsPowerShell", "v1.0", "powershell.exe");
            const r = spawnSync(executable, ["-NoProfile", "-NonInteractive", "-Command", "exit 0"], {
              cwd, stdio: "ignore", windowsHide: true, timeout: 10000,
            });
            if (r.status !== 0) throw new Error(`Windows PowerShell probe failed: ${r.error?.code ?? r.status}`);
          '
      - run: npm ci
      - name: Verify native credential and snapshot ACLs
        working-directory: packages/api
        run: npx --no-install jest --runInBand --coverage=false --runTestsByPath src/credentials.spec.ts src/agents/files/snapshots.spec.ts
