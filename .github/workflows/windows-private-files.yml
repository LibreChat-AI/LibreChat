name: Windows Private Files

on:
  pull_request:
    paths:
      - '.github/workflows/windows-private-files.yml'
      - 'packages/api/src/credentials*'
      - 'packages/api/src/agents/files/snapshots*'
      - 'packages/api/src/utils/windowsPrivate.ts'
      - 'packages/api/src/utils/windowsAcl.helper.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acl:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Verify private Windows filesystem operations
        run: |
          @'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdtempSync, readFileSync, realpathSync, rmSync } from 'node:fs';
          import { stripTypeScriptTypes } from 'node:module';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const source = readFileSync('packages/api/src/utils/windowsPrivate.ts', 'utf8');
          const encoded = Buffer.from(stripTypeScriptTypes(source)).toString('base64');
          const {
            finishWindowsPrivateRepair,
            makeWindowsPrivateDirectory,
            publishWindowsPrivateFile,
            readWindowsPrivateFile,
            windowsPowerShell,
          } = await import(`data:text/javascript;base64,${encoded}`);

          const { executable, cwd, env } = windowsPowerShell();
          const script = Buffer.from('[Console]::WriteLine("ready")', 'utf16le').toString('base64');
          for (const [name, options] of [['default', {}], ['restricted', { env }]]) {
            const result = spawnSync(executable, ['-NoProfile', '-NonInteractive', '-EncodedCommand', script], {
              cwd, ...options, stdio: ['ignore', 'pipe', 'pipe'], windowsHide: true, timeout: 10000,
            });
            console.log(`PowerShell ${name} launch: ${result.error?.code ?? result.status}`);
            assert.equal(result.status, 0, `PowerShell ${name} launch`);
            assert.equal(result.stdout.toString().trim(), 'ready');
          }

          const root = realpathSync.native(mkdtempSync(join(tmpdir(), 'lc-private-probe-')));
          try {
            const program = source.split('String.raw`')[1].split('`;')[0].replace(
              '  exit $script:failureStage',
              '  [Console]::Error.WriteLine(("ACL probe: {0} line {1} {2}" -f $_.Exception.GetType().Name,$_.InvocationInfo.ScriptLineNumber,$_.FullyQualifiedErrorId)); exit $script:failureStage',
            );
            const probe = spawnSync(executable, ['-NoProfile', '-NonInteractive', '-EncodedCommand',
              Buffer.from(program, 'utf16le').toString('base64')], {
              cwd, env: { ...env, TMP: root, TEMP: root, LIBRECHAT_PRIVATE_OPERATION: 'directory',
                LIBRECHAT_PRIVATE_TARGET: join(root, 'probe') },
              encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], windowsHide: true, timeout: 10000,
            });
            if (probe.status !== 0) {
              const diagnostic = probe.stderr?.match(/ACL probe: [a-zA-Z]+ line \d+ [\w.,]+/)?.[0];
              console.log(diagnostic ?? `ACL probe could not report a stage: ${probe.error?.code ?? probe.status}`);
            }
            const directory = await makeWindowsPrivateDirectory(join(root, 'snapshots-'));
            console.log('Private directory created.');
            const target = join(directory, 'fixture');
            const contents = 'synthetic ACL test';
            assert.equal(publishWindowsPrivateFile(join(directory, 'stage'), target, contents), 'written');
            assert.equal(publishWindowsPrivateFile(join(directory, 'stage'), `${target}.lock`, contents), 'written');
            console.log('Private files published.');
            let bytes;
            try {
              bytes = readWindowsPrivateFile(target);
            } catch (error) {
              const traced = program.replace(/(\$script:failureStage = ([0-9]+))/g,
                '$1; [Console]::Error.WriteLine(\"ACL stage $2\")');
              const read = spawnSync(executable, ['-NoProfile', '-NonInteractive', '-InputFormat', 'Text',
                '-EncodedCommand', Buffer.from(traced, 'utf16le').toString('base64')], {
                cwd, env: { ...env, TMP: root, TEMP: root, LIBRECHAT_PRIVATE_OPERATION: 'read',
                  LIBRECHAT_PRIVATE_TARGET: target },
                timeout: 10000, windowsHide: true, encoding: 'utf8', input: '\n',
              });
              console.log(`Read probe: ${read.error?.code ?? read.status}`,
                [...(read.stderr?.matchAll(/ACL stage [0-9]+|ACL probe: [a-zA-Z]+ line \d+ [\w.,]+/g) ?? [])].map(([m]) => m).join(', '));
              throw error;
            }
            assert.equal(bytes?.toString(), contents);
            const digest = createHash('sha256').update(bytes).digest('hex');
            assert.equal(finishWindowsPrivateRepair(`${target}.lock`, digest, target), true);
            console.log('Private file read and promoted.');
          } finally {
            rmSync(root, { recursive: true, force: true, maxRetries: 3 });
          }
          '@ | node --input-type=module
      - run: npm ci
      - name: Verify native credential and snapshot ACLs
        working-directory: packages/api
        run: npx --no-install jest --runInBand --coverage=false --runTestsByPath src/credentials.spec.ts src/agents/files/snapshots.spec.ts
