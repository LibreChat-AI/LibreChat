name: Backend Windows Tests

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/backend-windows-nightly.yml'
      - '.github/actions/mongodb-binary/**'
      - '.gitattributes'
      - 'config/jest.setup.mongo.cjs'
      - 'package-lock.json'
      - 'packages/api/src/acl/rolePermissions.spec.ts'
      - 'packages/api/src/cache/__tests__/outage.spec.ts'
      - 'packages/api/src/code/command.spec.ts'
      - 'packages/api/src/code/setup/bridge.spec.ts'
      - 'packages/api/src/images/authorization.spec.ts'
      - 'packages/api/src/mcp/__tests__/mcp.spec.ts'
      - 'packages/api/src/plugins/deployment.spec.ts'
      - 'packages/api/src/storage/__tests__/local.test.ts'
      - 'packages/api/src/utils/key.test.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=6144'
  MONGOMS_DISABLE_POSTINSTALL: '1'
  LIBRECHAT_TEST_BASH: 'C:\Program Files\Git\bin\bash.exe'

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/mongodb-binary
      - run: npm run build:data-provider
      - run: npm run build:data-schemas
      - name: Run backend portability tests
        working-directory: packages/api
        shell: bash
        run: >-
          npm run test:ci -- --runInBand --coverage=false --runTestsByPath
          src/acl/rolePermissions.spec.ts
          src/cache/__tests__/outage.spec.ts
          src/code/command.spec.ts
          src/code/setup/bridge.spec.ts
          src/images/authorization.spec.ts
          src/mcp/__tests__/mcp.spec.ts
          src/plugins/deployment.spec.ts
          src/storage/__tests__/local.test.ts
          src/utils/key.test.ts
